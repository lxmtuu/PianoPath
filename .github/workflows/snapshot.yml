name: shell-snapshots

# Temporary helper: renders the concert shell on a real Windows runner so the README
# screenshots can be refreshed from a build of the current sources.
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PianoPath.csproj

      - name: Build
        run: dotnet build PianoPath.csproj --configuration Release --no-restore

      - name: Capture shell snapshots
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'bin/Release/net10.0-windows/PianoPath.exe').Path
          $out = Join-Path $env:RUNNER_TEMP 'snapshots'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # A GUI-subsystem process writes nothing to the console, so keep its redirected
          # streams on disk: an unhandled startup exception is exactly what we need to see.
          function Shot([string]$name, [string[]]$extra) {
            $png = Join-Path $out $name
            $so = Join-Path $out "$name.stdout.txt"; $se = Join-Path $out "$name.stderr.txt"
            $p = Start-Process -FilePath $exe -ArgumentList (@('--snapshot', $png) + $extra) -PassThru -Wait -RedirectStandardOutput $so -RedirectStandardError $se
            "--- $name exit=$($p.ExitCode) png=$(Test-Path $png)"
            if (Test-Path $se) { Get-Content $se | Select-Object -First 40 }
            if (Test-Path $so) { Get-Content $so | Select-Object -First 40 }
          }
          Shot 'menu-preview.png' @('--menu')
          Shot 'preview.png' @('--play-preview')
          Shot 'settings-preview.png' @('--show-settings', '--settings-tab=theme')
          Get-ChildItem $out -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: keyflow-snapshots
          path: |
            ${{ runner.temp }}/snapshots/*.png
            ${{ runner.temp }}/snapshots/*.txt
          if-no-files-found: warn
