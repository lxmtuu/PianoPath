name: build

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      review:
        description: 'Full build or the bounded native mixed-particle diagnostic'
        type: choice
        default: full
        options: [full, key-ensemble, ar-budget, app-build]

# The preview step commits the freshly rendered screenshots back to the branch it built, which keeps
# docs/previews in step with the interface without anyone copying files around by hand. A branch that
# only takes pull requests declines that push; the step then warns instead of failing (see below).
permissions:
  contents: write

# Actions minutes are billed (2x on Windows) now that this repository is private, and a working session
# pushes a dozen times an hour while the Windows job alone takes about fifteen minutes: without this the
# runs stack up and every one of them spends a full fifteen minutes. A newer run of the same ref therefore
# replaces the older one — except on main, where a cancelled run would throw away the preview commit that
# belongs to a commit people are already reading.
concurrency:
  group: build-${{ github.ref }}${{ ((github.event_name == 'workflow_dispatch' && inputs.review == 'app-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-build]'))) && '-app-build' || (((github.event_name == 'workflow_dispatch' && inputs.review == 'ar-budget') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ar-budget-native]'))) && '-ar-budget' || (((github.event_name == 'workflow_dispatch' && inputs.review == 'key-ensemble') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ensemble-native]'))) && '-key-ensemble' || '')) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Fast lane: syntax, XAML resources, the settings-navigation catalogue, the theme tokens, the string tables,
  # the installer translation and every README link are checked in about ten seconds on a Linux runner, so a typo
  # turns red before the Windows job is even scheduled. The whole job is one script, which is why it can run on a
  # machine that has nothing but Python.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Static source check
        run: python3 tools/check_sources.py

      # The effect plan quotes 27 measurements taken from the shipping sources, and the three A/B labs the
      # documents link to carry their own assertions. They run beside check_sources.py so a constant that
      # drifts, or a lab that stops matching its shader, turns the fast lane red before any build starts.
      - name: Effect plan and prototype checks
        run: |
          python3 tools/note_effects_report.py --check
          node tools/check_note_view_lab.cjs
          node tools/check_damper_light.cjs
          node tools/check_particle_motion_lab.cjs

      # Input-fixture validation only; does not claim Windows/GPU/AR render evidence.
      - name: Prism Flow baseline input checks
        if: >-
          !((github.event_name == 'workflow_dispatch' && inputs.review == 'app-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-build]')))
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/make_prism_flow_fixture.py
          python3 tools/make_prism_flow_fixture.py --check

  # Second lane: the checks that used to live only inside `--verify`, which means they could only run on
  # a Windows runner and could not be run one at a time. tests/PianoPath.Tests links the sources that
  # need neither WPF nor WinMM (MIDI, MusicXML, the hand-split guess, the meter table, the WAV writer,
  # the string table) and runs them under xUnit on plain net10.0, so a MIDI regression goes red here in
  # about a minute without waiting for a Windows runner to be free. It runs beside `build` rather than
  # in front of it: both only need `static`, and neither is a prerequisite for the other.
  test:
    if: >-
      !((github.event_name == 'workflow_dispatch' && inputs.review == 'app-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-build]')))
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run the portable test project
        run: >-
          dotnet test tests/PianoPath.Tests/PianoPath.Tests.csproj
          --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory "$RUNNER_TEMP/test-results"

      # A red run has to name the test that went red. The console logger prints that, but a job log is
      # only readable while somebody is watching it, and this project exists precisely so a regression
      # can be diagnosed from a phone. So the failures are read back out of the TRX and published as
      # annotations, which stay queryable through the API long after the log is awkward to reach.
      - name: Name the tests that failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'test-results') -Filter *.trx -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $trx) { 'No test results were written.'; exit 0 }
          [xml]$run = Get-Content $trx.FullName
          $summary = $run.TestRun.ResultSummary
          $counters = $summary.Counters
          "outcome $($summary.outcome): $($counters.passed) passed, $($counters.failed) failed, $($counters.notExecuted) not executed, $($counters.total) total"
          @(
            '# Portable test project'
            ''
            "Outcome **$($summary.outcome)** — $($counters.passed) passed, $($counters.failed) failed, $($counters.notExecuted) not executed of $($counters.total)."
          ) | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          foreach ($test in @($run.TestRun.Results.UnitTestResult)) {
            if ($test.outcome -ne 'Failed') { continue }
            $detail = "$($test.Output.ErrorInfo.Message) $($test.Output.ErrorInfo.StackTrace)" -replace '\s+', ' '
            if ($detail.Length -gt 800) { $detail = $detail.Substring(0, 800) + '…' }
            $text = "$($test.testName) — $detail" -replace '%', '%25'
            "::error title=Test failed::$text"
          }

  # Compile/package only: explicitly no native capture, performance or test rerun.
  app-build:
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.review == 'app-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-build]')))
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish private Windows integration build
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'keyflow-app-win-x64'
          ./publish.ps1 -Mode SelfContained -Runtime win-x64 -Output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $output 'PianoPath.exe'
          if (-not (Test-Path $exe)) { throw 'Published executable is missing.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          @("Source: $env:GITHUB_SHA", 'Private integration build; not a public release.', 'Self-contained Windows x64; native/performance/runtime checks not run.', "PianoPath.exe SHA256: $hash") | Set-Content (Join-Path $output 'BUILD-INFO.txt')
          @('# Windows integration build', "Source: $env:GITHUB_SHA", "Executable SHA256: $hash", 'Compile/package only: native/performance/runtime checks were not run.') | Set-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload private application build
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-app-win-x64
          path: ${{ runner.temp }}/keyflow-app-win-x64/
          if-no-files-found: error
          retention-days: 7

  keyboard-light:
    if: >-
      !((((github.event_name == 'workflow_dispatch' && inputs.review == 'key-ensemble') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ensemble-native]'))) || ((github.event_name == 'workflow_dispatch' && inputs.review == 'ar-budget') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ar-budget-native]')))) || ((github.event_name == 'workflow_dispatch' && inputs.review == 'app-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-build]'))))
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build key-light diagnostic
        run: dotnet build PianoPath.csproj --configuration Release
      - name: Native keyboard lamp response
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'keyboard-key-light'
          $log = Join-Path $env:RUNNER_TEMP 'keyboard-key-light.log'
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList '--verify','--verify-key-light-only',"--verify-review-out=$review","--verify-log=$log" -PassThru -Wait
          if (Test-Path $log) { Get-Content $log }
          if ($proc.ExitCode -ne 0) { Write-Output '::error title=Keyboard key-light::Native diagnostic failed'; exit $proc.ExitCode }
      - name: Validate and bound native key-light publication
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $review = Join-Path $env:RUNNER_TEMP 'keyboard-key-light'
          python tools/review_keyboard_key_light.py $review --source-root . --expected-revision $env:GITHUB_SHA --publish-evidence docs/evidence/keyboard-key-light-v1 --publish-previews docs/previews/keyboard-key-light-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '::notice title=Keyboard key-light::154 native captures passed: true zero, unchanged 25–200 percent, monotone fixed-scene ramps, no AR/packet/background change. Full build is a separate job, not implied by this diagnostic.'
      - name: Publish native key-light originals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyboard-key-light-native
          path: |
            ${{ runner.temp }}/keyboard-key-light
            ${{ runner.temp }}/keyboard-key-light.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save bounded native key-light evidence
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          git config user.name 'keyflow previews'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/keyboard-key-light-v1 docs/previews/keyboard-key-light-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh native keyboard key-light evidence [skip ci]'
          # Two runs of one branch can be alive at once: a cancelled run's evidence step finishes after
          # its successor has started, both rewrite the same files, and `git pull --rebase` stops on the
          # first one they both touched -- which is how run 39324857917 went red on 2026-10-19 with all
          # 154 native captures passed and the evidence commit already on the branch. This step follows
          # the rule "Commit refreshed previews" documents above: a branch that moved while this job
          # rendered keeps the evidence belonging to its newer tip, and this run's renders stay in the
          # keyboard-key-light-native artifact. bash rather than pwsh because the decision needs git's exit code and
          # its message side by side.
          log="$RUNNER_TEMP/key-light-push.log"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          tip=$(git rev-parse "origin/$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::warning title=Key-light evidence not committed::The branch moved while this build rendered (now $tip, this run built $GITHUB_SHA), so the refreshed evidence was not pushed. It is in the keyboard-key-light-native artifact of this run."
            exit 0
          fi
          if git push >"$log" 2>&1; then cat "$log"; exit 0; fi
          cat "$log"
          if grep -Eqi 'GH013|repository rule violations|protected branch|non-fast-forward|fetch first|stale info|cannot lock ref' "$log"; then
            echo "::warning title=Key-light evidence not committed::The branch would not take the evidence push, so it keeps the set it already has. The renders are in the keyboard-key-light-native artifact of this run."
            exit 0
          fi
          exit 1

  # Focused native lane (manual or explicit push marker): never cancel/re-run the full lane for diagnostic-only work.
  key-ensemble:
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.review == 'key-ensemble') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ensemble-native]')))
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build ensemble diagnostic
        run: dotnet build PianoPath.csproj --configuration Release
      - name: Native mixed-scene checkpoints
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'key-particle-ensemble'
          $log = Join-Path $env:RUNNER_TEMP 'key-particle-ensemble.log'
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList '--verify','--verify-key-ensemble-only',"--verify-review-out=$review","--verify-log=$log" -PassThru -Wait
          if (Test-Path $log) { Get-Content $log }
          if ($proc.ExitCode -ne 0) { Write-Output '::error title=Key ensemble::Native mixed diagnostic failed'; exit $proc.ExitCode }
      - name: Validate original ensemble pixels and bounded subset
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $review = Join-Path $env:RUNNER_TEMP 'key-particle-ensemble'
          python tools/review_key_particle_ensemble.py $review --source-root . --expected-revision $env:GITHUB_SHA --publish-evidence docs/evidence/key-particle-ensemble-v1 --publish-previews docs/previews/key-particle-ensemble-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '::notice title=Key ensemble::1120 native checkpoints verified. Static integration slice only, not continuous motion, hardware, full regression or art approval.'
      - name: Publish native ensemble originals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: key-particle-ensemble-native
          path: |
            ${{ runner.temp }}/key-particle-ensemble
            ${{ runner.temp }}/key-particle-ensemble.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save bounded ensemble evidence
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          git config user.name 'keyflow previews'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/key-particle-ensemble-v1 docs/previews/key-particle-ensemble-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh native mixed key-particle evidence [skip ci]'
          # Two runs of one branch can be alive at once: a cancelled run's evidence step finishes after
          # its successor has started, both rewrite the same files, and `git pull --rebase` stops on the
          # first one they both touched -- which is how run 39324857917 went red on 2026-10-19 with all
          # 154 native captures passed and the evidence commit already on the branch. This step follows
          # the rule "Commit refreshed previews" documents above: a branch that moved while this job
          # rendered keeps the evidence belonging to its newer tip, and this run's renders stay in the
          # key-particle-ensemble-native artifact. bash rather than pwsh because the decision needs git's exit code and
          # its message side by side.
          log="$RUNNER_TEMP/ensemble-push.log"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          tip=$(git rev-parse "origin/$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::warning title=Ensemble evidence not committed::The branch moved while this build rendered (now $tip, this run built $GITHUB_SHA), so the refreshed evidence was not pushed. It is in the key-particle-ensemble-native artifact of this run."
            exit 0
          fi
          if git push >"$log" 2>&1; then cat "$log"; exit 0; fi
          cat "$log"
          if grep -Eqi 'GH013|repository rule violations|protected branch|non-fast-forward|fetch first|stale info|cannot lock ref' "$log"; then
            echo "::warning title=Ensemble evidence not committed::The branch would not take the evidence push, so it keeps the set it already has. The renders are in the key-particle-ensemble-native artifact of this run."
            exit 0
          fi
          exit 1

  ar-budget:
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.review == 'ar-budget') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ar-budget-native]')))
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build AR budget diagnostic
        run: dotnet build PianoPath.csproj --configuration Release
      - name: Native mixed-scene checkpoints
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'ar-particle-budget'
          $log = Join-Path $env:RUNNER_TEMP 'ar-particle-budget.log'
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList '--verify','--verify-ar-budget-only',"--verify-review-out=$review","--verify-log=$log" -PassThru -Wait
          if (Test-Path $log) { Get-Content $log }
          if ($proc.ExitCode -ne 0) { Write-Output '::error title=Key AR budget::Native mixed diagnostic failed'; exit $proc.ExitCode }
      - name: Validate original AR budget pixels and bounded subset
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $review = Join-Path $env:RUNNER_TEMP 'ar-particle-budget'
          python tools/review_ar_particle_budget.py $review --source-root . --expected-revision $env:GITHUB_SHA --publish-evidence docs/evidence/ar-particle-budget-v1 --publish-previews docs/previews/ar-particle-budget-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '::notice title=Key AR budget::904 native budget captures verified. Review-only fixed-cap trial with a bounded temporal slice, not full-lifecycle playback, hardware, full regression or art approval.'
      - name: Publish native AR budget originals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ar-particle-budget-native
          path: |
            ${{ runner.temp }}/ar-particle-budget
            ${{ runner.temp }}/ar-particle-budget.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save bounded AR budget evidence
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          git config user.name 'keyflow previews'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/ar-particle-budget-v1 docs/previews/ar-particle-budget-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh native mixed key-particle evidence [skip ci]'
          # Two runs of one branch can be alive at once: a cancelled run's evidence step finishes after
          # its successor has started, both rewrite the same files, and `git pull --rebase` stops on the
          # first one they both touched -- which is how run 39324857917 went red on 2026-10-19 with all
          # 154 native captures passed and the evidence commit already on the branch. This step follows
          # the rule "Commit refreshed previews" documents above: a branch that moved while this job
          # rendered keeps the evidence belonging to its newer tip, and this run's renders stay in the
          # ar-particle-budget-native artifact. bash rather than pwsh because the decision needs git's exit code and
          # its message side by side.
          log="$RUNNER_TEMP/ar-budget-push.log"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          tip=$(git rev-parse "origin/$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::warning title=AR budget evidence not committed::The branch moved while this build rendered (now $tip, this run built $GITHUB_SHA), so the refreshed evidence was not pushed. It is in the ar-particle-budget-native artifact of this run."
            exit 0
          fi
          if git push >"$log" 2>&1; then cat "$log"; exit 0; fi
          cat "$log"
          if grep -Eqi 'GH013|repository rule violations|protected branch|non-fast-forward|fetch first|stale info|cannot lock ref' "$log"; then
            echo "::warning title=AR budget evidence not committed::The branch would not take the evidence push, so it keeps the set it already has. The renders are in the ar-particle-budget-native artifact of this run."
            exit 0
          fi
          exit 1

  build:
    if: >-
      !((((github.event_name == 'workflow_dispatch' && inputs.review == 'key-ensemble') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ensemble-native]'))) || ((github.event_name == 'workflow_dispatch' && inputs.review == 'ar-budget') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ar-budget-native]')))) || ((github.event_name == 'workflow_dispatch' && inputs.review == 'app-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-build]'))))
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No sample library is checked into the repository; Salamander is downloaded by the app after an explicit request.
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PianoPath.csproj

      - name: Build
        run: dotnet build PianoPath.csproj --configuration Release --no-restore

      # N17 runs on its own before the long suite, for the same reason the key-light and AR-budget jobs do:
      # a crash in the new review should name itself in ten minutes instead of taking the whole suite down
      # forty minutes in and leaving the failure to be guessed from a truncated log. It writes the same
      # folder the suite writes later, byte for byte, so the two runs do not disagree.
      - name: AR effect-family review (N17)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'keyflow-ar-effect.log'
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review'
          New-Item -ItemType Directory -Force -Path $review | Out-Null
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList '--verify','--verify-ar-effect-only',"--verify-review-out=$review","--verify-log=$log" -PassThru -Wait
          if (Test-Path $log) {
            Get-Content $log | ForEach-Object {
              Write-Output $_
              if ($_ -like 'FAIL*') { "::error title=N17 AR effect families::$_" } elseif ($_ -like 'PASS AR effect-family review*') { "::notice title=N17 AR effect families::$_" }
            }
          } else { "::error title=N17 AR effect families::No verification log was written" }
          exit $proc.ExitCode

      # Fail fast on functional/native/WPF regressions before expensive art-review recaptures.
      # Runs on every push and blocks the build. The suite detects what the runner is missing
      # (no local Salamander download, no audio device, an unopenable MIDI port) and reports those as
      # SKIP/NOTE instead of failing, so a red step here means a real regression.
      # Every log line is also echoed into the job summary; annotations stay under GitHub's
      # 10-per-level cap by only surfacing SKIP/NOTE/FAIL plus the final summary line.
      - name: Verification suite
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'keyflow-verification.log'
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review'
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList "--verify","--verify-log=$log","--verify-review-out=$review" -PassThru -Wait
          $lines = if (Test-Path $log) { Get-Content $log } else { @() }
          # A child process that reports every stage it reaches can print more NOTE lines than GitHub will
          # show, and the ones that matter are the last ones — the step the machine stopped at. So only the
          # tail of the NOTEs is surfaced: SKIP and FAIL lines always are, and the whole log is in the job
          # summary and in the run's artifacts either way.
          $notes = @($lines | Where-Object { $_ -like 'NOTE*' })
          $tail = @($notes | Select-Object -Last 6)
          # A FAIL line is this run's own failure, with one exception. The MP4 take is written by a child
          # process, and the suite copies that child's lines into the log in the machine's own words — FAIL lines
          # and all, since they are what says where the machine stopped. The suite's own answer to them is a SKIP
          # line that names the step the child stopped at word for word (see Diagnostics/Mp4TakeAttempt.cs). So a
          # FAIL line that appears inside a SKIP line was written by the machine's child process and not by the
          # suite: the suite has already ruled on that step, and annotating it as an error put a red mark on
          # green runs whose only trouble was a take this machine cannot write. The line is still in the job
          # summary and in the artifact, right where the suite answers it.
          $skipLines = @($lines | Where-Object { $_ -like 'SKIP*' }) -join "`n"
          $lines | ForEach-Object {
            if ($_ -like 'FAIL*') { if ($skipLines.Contains($_)) { return }; $level = 'error' }
            elseif ($_ -like 'SKIP*') { $level = 'warning' }
            elseif ($_ -like 'NOTE*') { if ($_ -notin $tail) { return }; $level = 'warning' }
            elseif ($_ -like 'Verification passed*' -or $_ -like 'Verification failed*') { $level = 'notice' }
            else { return }
            $text = $_ -replace '%', '%25'
            "::${level} title=Keyflow verification::$text"
          }
          # The exit code and the very last line of the log are named whatever the log says: a run that is
          # taken down inside a native call never reaches the suite's own verdict, and then the last line is the
          # only thing that says where the process died.
          $last = if ($lines) { $lines[-1] } else { '<the log was empty>' }
          "::notice title=Keyflow verification::PianoPath.exe exited with code $($proc.ExitCode) after $($lines.Count) log line(s)."
          if (-not $lines) { "::error title=Keyflow verification::PianoPath.exe did not write $log" }
          elseif ($last -notlike 'Verification passed*' -and $last -notlike 'Verification failed*') {
            $text = $last -replace '%', '%25'
            "::error title=Keyflow verification::The log ends without a verdict, at: $text"
          }
          @('# Keyflow verification suite', '```', $lines, '```') | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $proc.ExitCode

      # The contact sheets are the N12 pictures a person actually looks at, and the only part of that review small
      # enough to belong in Git: the 285 native captures stay in the run's artifacts, which are published on main
      # and not on a working branch. Copying the seven sheets into docs/evidence is what turns "the job was green"
      # into "here is what it drew, on this commit, for anyone who opens the repository".
      #
      # Staged here (just after the suite that wrote them) and committed by "Commit refreshed previews" further
      # down, together with the previews, on purpose: a second commit step in this job would race the first one
      # for the branch tip, and the tip rule those steps share ("a branch that moved keeps its own evidence")
      # would then skip one of the two every time. One push, one rule, both sets of pictures.
      - name: Stage the review contact sheets
        shell: bash
        run: |
          review="$RUNNER_TEMP/phase1-visual-review"
          # Every copy is required: a sheet the suite did not write is a finding, not something to skip past.
          out=docs/evidence/n12-sheets
          mkdir -p "$out"
          cp -- "$review/option-matrix/sheet-wpf.png" "$out/matrix-wpf.png"
          cp -- "$review/option-matrix/sheet-gpu-warp.png" "$out/matrix-gpu-warp.png"
          cp -- "$review/option-numeric/sheet.png" "$out/numeric.png"
          cp -- "$review/preset-roundtrip/sheet.png" "$out/preset.png"
          for file in "$review"/option-pose/sheet-*.png; do
            name=$(basename "$file" .png | sed 's/^sheet-//')
            cp -- "$file" "$out/pose-$name.png"
          done
          # N8 keeps its own folder: the page is about refraction on six note materials, not about the option
          # matrix, and a reviewer should not have to know which of the two grids a file belongs to.
          refraction=docs/evidence/refraction-sheets
          mkdir -p "$refraction"
          cp -- "$review/refraction/sheet-wpf.png" "$refraction/wpf.png"
          cp -- "$review/refraction/sheet-gpu-warp.png" "$refraction/gpu-warp.png"
          # N16 is the AR overlay's own page: one grid per pose is not needed, one pose carries every material.
          ar=docs/evidence/ar-material-sheets
          mkdir -p "$ar"
          cp -- "$review/ar-material/sheet.png" "$ar/material.png"
          # N17 is the overlay's effect side: one sheet per scene, one row per family, one column per setting,
          # so a reviewer reads a family across a single line instead of hunting for it in a grid of materials.
          # Every sheet is required: a scene the suite did not write is a finding, not something to skip past.
          effect=docs/evidence/ar-effect-sheets
          mkdir -p "$effect"
          for sheet in held approach impact release; do
            cp -- "$review/ar-effect/sheet-$sheet.png" "$effect/$sheet.png"
          done
          ls -l "$out" "$refraction" "$ar" "$effect"

      # Isolate deterministic P0 capture from realtime/device smoke tests. Both still block the build.
      - name: Prism Flow baseline and candidate verification
        id: prism-review
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'keyflow-prism-verification.log'
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review'
          New-Item -ItemType Directory -Force -Path $review | Out-Null
          Copy-Item 'docs/evidence/held-light-isolation/manifest.json' (Join-Path $review 'prior-light-isolation.json')
          Copy-Item 'docs/evidence/wisps-v3/manifest.json' (Join-Path $review 'prior-wisps-v3.json')
          Copy-Item 'docs/evidence/wisps-v3/motion-manifest.json' (Join-Path $review 'prior-wisps-motion.json')
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList "--verify","--verify-prism-only","--verify-log=$log","--verify-review-out=$review" -PassThru -Wait
          if (Test-Path $log) {
            Get-Content $log | ForEach-Object {
              Write-Output $_
              if ($_ -like 'FAIL*') { "::error title=Prism Flow P0::$_" }
              elseif ($_ -like 'NOTE P0 baseline sample*' -or $_ -like 'PASS Prism Flow*' -or $_ -like 'PASS P3a*' -or $_ -like 'PASS P3b*') { "::notice title=Prism Flow P0::$_" }
            }
          } else { "::error title=Prism Flow P0::No verification log was written" }
          exit $proc.ExitCode

      # Keep only six representative, app-rendered baseline images with the existing preview commit.
      # The complete 78-frame review and manifest stay in artifacts, not in Git.
      - name: Stage representative Prism Flow baseline previews
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/prism-flow-p0'
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.captureCount -ne 78) { throw 'Incomplete Prism Flow baseline artifact' }
          $target = 'docs/previews/prism-flow-p0'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($preset in @('concert-gold', 'ice-crystal', 'neon-violet')) {
            foreach ($mode in @('live-stage', 'ar')) {
              $source = Join-Path $review "$preset/$mode/dense-chord-baseline.png"
              if (-not (Test-Path $source)) { throw "Missing baseline: $source" }
              Copy-Item $source (Join-Path $target "$preset-$mode.png") -Force
            }
          }

      - name: Stage Prism Flow palette and satin previews
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/prism-flow-p1'
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.captureCount -ne 30) { throw 'Incomplete Prism Flow candidate artifact' }
          foreach ($image in $manifest.captures | Where-Object { $_.Checkpoint -eq 'dense-chord' }) {
            "::notice title=Prism Flow candidate::NOTE P1 sample $($image.Mode)/$($image.Variant): changed pixels=$($image.ChangedPixels), pixel SHA256=$($image.PixelSha256)."
          }
          $target = 'docs/previews/prism-flow-p1'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($mode in @('live-stage', 'ar')) {
            foreach ($variant in @('candidate', 'texture-off', 'bloom-off')) {
              $source = Join-Path $review "prism-flow-preview/$mode/dense-chord-$variant.png"
              if (-not (Test-Path $source)) { throw "Missing candidate: $source" }
              Copy-Item $source (Join-Path $target "$mode-$variant.png") -Force
            }
          }

      # All 70 current-family frames live in the review artifact; keep only five families' paired
      # press/held pictures in Git for the next art pass. Zone/release/off/tail stay in the manifest.
      - name: Stage particle family baseline previews
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/key-particles-p3a'
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.captureCount -ne 70) { throw 'Incomplete particle family inventory' }
          $target = 'docs/previews/prism-flow-p3a'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($family in @('embers', 'splash', 'fireworks', 'confetti', 'dust')) {
            $samples = @($manifest.captures | Where-Object { $_.Family -eq $family -and $_.Phase -eq 'held' })
            if ($samples.Count -ne 2) { throw "Missing paired held counters: $family" }
            $counts = ($samples | ForEach-Object { "$($_.Mode):StageSprites=$($_.StageSprites),ARParticles=$($_.ArParticles),delta=$($_.ChangedPixels)" }) -join '; '
            "::notice title=Particle family baseline::$family / $counts"
            foreach ($mode in @('live-stage', 'ar')) {
              foreach ($phase in @('burst', 'held')) {
                $source = Join-Path $review "$family/$mode/$phase.png"
                if (-not (Test-Path $source)) { throw "Missing particle baseline: $source" }
                Copy-Item $source (Join-Path $target "$family-$mode-$phase.png") -Force
              }
            }
          }

      - name: Stage auxiliary particle baselines
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/key-particles-aux'
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.captureCount -ne 128) { throw 'Incomplete auxiliary particle inventory' }
          $target = 'docs/previews/prism-flow-p3a-aux'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($route in $manifest.settings) {
            $samples = @($manifest.captures | Where-Object { $_.Route -eq $route.Id -and $_.Phase -eq 'active' })
            if ($samples.Count -ne 4) { throw "Missing white/black Stage/AR auxiliary pair: $($route.Id)" }
            $counts = ($samples | ForEach-Object { "$($_.Pitch)/$($_.Mode):sprites=$($_.StageSprites),particles=$($_.ArParticles),release=$($_.ArReleaseEffects),delta=$($_.ChangedPixels),sha=$($_.PixelSha256)" }) -join '; '
            "::notice title=Auxiliary particle baseline::$($route.Id) / $counts"
            foreach ($sample in $samples) {
              $source = Join-Path $review $sample.File
              if (-not (Test-Path $source)) { throw "Missing auxiliary baseline: $source" }
              Copy-Item $source (Join-Path $target "$($route.Id)-$($sample.Pitch)-$($sample.Mode)-active.png") -Force
            }
          }

      - name: Assemble and stage experimental held particle review
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/held-particle-art'
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.captureCount -ne 32 -or -not $manifest.heldArt) { throw 'Incomplete held art prototype' }
          python tools/make_held_particle_clips.py (Join-Path $review 'motion')
          if ($LASTEXITCODE -ne 0) { throw 'Motion assembly failed' }
          $target = 'docs/previews/held-particle-art'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          # docs/previews is image-only. Stable capture evidence belongs outside that directory.
          $evidence = 'docs/evidence/held-particle-art'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Copy-Item (Join-Path $review 'manifest.json') (Join-Path $evidence 'manifest.json') -Force
          Copy-Item (Join-Path $review 'motion/manifest.json') (Join-Path $evidence 'motion-manifest.json') -Force
          $active = @($manifest.captures | Where-Object { $_.Phase -eq 'active' })
          if ($active.Count -ne 8) { throw 'Missing paired held material images' }
          foreach ($sample in $active) {
            Copy-Item (Join-Path $review $sample.File) (Join-Path $target "$($sample.Route)-$($sample.Pitch)-$($sample.Mode)-art.png") -Force
          }
          $clips = @(Get-ChildItem (Join-Path $review 'motion') -Filter *.png)
          if ($clips.Count -ne 8) { throw 'Missing lossless APNG comparisons' }
          foreach ($clip in $clips) {
            Copy-Item $clip.FullName (Join-Path $target "$($clip.BaseName)-motion.png") -Force
          }
          python tools/review_held_particle_art.py --output (Join-Path $review 'review-player.html') --label $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Frame-locked review player failed' }
          "::notice title=Held particle art::32 static captures, 8 active representatives, 8 lossless 60-frame 30-FPS APNG crops staged. Prototype only, no visual/hardware acceptance."

      - name: Validate and stage held particle lighting controls
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/held-particle-controls'
          # Review-only PNG decoding; no application/runtime dependency.
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Review image decoder install failed' }
          python tools/review_held_particle_controls.py $review --source-root . --expected-revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Held control pixel/source validation failed' }
          $evidence = 'docs/evidence/held-particle-controls'
          $target = 'docs/previews/held-particle-controls'
          New-Item -ItemType Directory -Force -Path $evidence,$target | Out-Null
          Copy-Item (Join-Path $review 'manifest.json') (Join-Path $evidence 'manifest.json') -Force
          $sheets = @(Get-ChildItem (Join-Path $review 'sheets') -Filter *.png)
          if ($sheets.Count -ne 72) { throw 'Incomplete held control quartets' }
          foreach ($sheet in $sheets) { Copy-Item $sheet.FullName (Join-Path $target $sheet.Name) -Force }
          # Keep 16 actual full frames for local full-scene review, not reconstructed backgrounds.
          # All 288 originals still stay in the artifact; no HTML/base64 in the image-only tree.
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          $fullTarget = 'docs/previews/held-particle-controls-scenes'
          New-Item -ItemType Directory -Force -Path $fullTarget | Out-Null
          $fullScenes = @($manifest.scenes | Where-Object { $_.pattern -eq 'chord' -and ($_.palette -eq 'prism' -or $_.view -in @('live-stage','ar-reference')) })
          if ($fullScenes.Count -ne 16) { throw 'Missing representative full scenes' }
          foreach ($scene in $fullScenes) {
            $combined = @($scene.captures | Where-Object { $_.Variant -eq 'combined' })
            if ($combined.Count -ne 1) { throw "Missing combined full frame: $($scene.Id)" }
            Copy-Item (Join-Path $review $combined[0].File) (Join-Path $fullTarget "$($scene.Id).png") -Force
          }
          "::notice title=Held lighting controls::288 WARP frame hashes, 72 native quartet hashes/crop reconstructions and source hashes verified. Synthetic static controls only, not visual acceptance."

      - name: Validate and stage tint spill and coverage study
        shell: pwsh
        run: |
          $review = Join-Path $env:RUNNER_TEMP 'phase1-visual-review/held-light-isolation'
          python tools/review_held_light_isolation.py $review --source-root . --expected-revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Tint/spill coverage evidence validation failed' }
          $evidence = 'docs/evidence/held-light-isolation'
          $target = 'docs/previews/held-light-isolation'
          New-Item -ItemType Directory -Force -Path $evidence,$target | Out-Null
          Copy-Item (Join-Path $review 'manifest.json') (Join-Path $evidence 'manifest.json') -Force
          $sheets = @(Get-ChildItem (Join-Path $review 'sheets') -Filter *.png)
          if ($sheets.Count -ne 48) { throw 'Incomplete tint/spill quartets' }
          foreach ($sheet in $sheets) { Copy-Item $sheet.FullName (Join-Path $target $sheet.Name) -Force }
          # Only four new low-load full frames in Git. Normal-load full scenes already exist.
          $manifest = Get-Content (Join-Path $review 'manifest.json') -Raw | ConvertFrom-Json
          $selected = @($manifest.scenes | Where-Object { $_.load -eq 'low' -and $_.palette -eq 'prism' })
          if ($selected.Count -ne 4) { throw 'Missing sub-cap full-scene samples' }
          foreach ($scene in $selected) {
            $combined = @($scene.captures | Where-Object { $_.Variant -eq 'on-both' })
            if ($combined.Count -ne 1) { throw 'Missing sub-cap combined frame' }
            Copy-Item (Join-Path $review $combined[0].File) (Join-Path $target "$($scene.Id)-full.png") -Force
          }
          "::notice title=Tint spill coverage::192 WARP frames, 48 native quartet hashes/crops, per-pitch/age packing invariants and source guards verified. No art/performance acceptance."

      - name: Validate and stage paired Wisps v3 candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'phase1-visual-review'
