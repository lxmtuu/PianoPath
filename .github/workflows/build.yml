      # GitHub shows at most ten annotations of one level, and a run whose child process reports its stages
      # line by line has more NOTEs than that: the lines that matter are the ones near the end. So the step
      # above leaves the older NOTEs to the job summary, and this one keeps the whole log as an artifact —
      # the only way to read a run back later, since the annotations that overflowed cannot be recovered
      # from the API.
      - name: Publish the verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-verification-log
          path: |
            ${{ runner.temp }}/keyflow-verification.log
            ${{ runner.temp }}/keyflow-prism-verification.log
            ${{ runner.temp }}/keyflow-arvideo-failure-*.avi
          if-no-files-found: warn
          overwrite: true

      # Human review gate: the fixture is rendered through the real WPF stage and the app's GPU renderer
      # forced to WARP. The 960×540 files are 2×2 averages of the matching 1080p pixels, not fresh layouts.
      # Arena branch pushes also trigger a PR run for the same revision; keep this 1+ GiB review bundle on
      # the PR run (and main/manual runs), not twice for every commit. A session pushes a dozen commits an
      # hour, so the artifact is overwritten rather than accumulated: one review window, always the newest
      # revision. Accumulating one 1.4 GB bundle per commit is what exhausted the repository's storage
      # quota and started failing every upload from the verification log on.
      - name: Publish Phase 1 visual review
        if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: phase1-visual-review
          # The option matrix, the AR/pose slice and the numeric review live in the same folder but have their own
          # small artifacts below; excluding them here keeps this bundle at the size it had before N12.
          path: |
            ${{ runner.temp }}/phase1-visual-review/**
            !${{ runner.temp }}/phase1-visual-review/option-matrix/**
            !${{ runner.temp }}/phase1-visual-review/option-pose/**
            !${{ runner.temp }}/phase1-visual-review/option-numeric/**
            !${{ runner.temp }}/phase1-visual-review/preset-roundtrip/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 2

      # N12(b): 128 contact-sheet PNGs, not video. A reviewer can fetch this without the 1+ GiB bundle, and
      # a failed matrix run still leaves whatever it managed to write.
      - name: Publish the option matrix (N12(b))
        if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: option-matrix-n12b
          path: ${{ runner.temp }}/phase1-visual-review/option-matrix
          if-no-files-found: warn
          overwrite: true
          retention-days: 2

      # N12(d) part 1: 27 AR captures (four off states + five values, per calibrated pose) with the camera
      # fixture, so the projection half of the audit can be reviewed without the full bundle.
      - name: Publish the AR/pose option slice (N12(d))
        if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: option-pose-n12d
          path: ${{ runner.temp }}/phase1-visual-review/option-pose
          if-no-files-found: warn
          overwrite: true
          retention-days: 2

      # N12(e): 54 captures (nine numeric axes × three values × two renderers) with the pair table, so a slider
      # whose two positions paint one picture can be inspected without the full bundle.
      - name: Publish the numeric option review (N12(e))
        if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: option-numeric-n12e
          path: ${{ runner.temp }}/phase1-visual-review/option-numeric
          if-no-files-found: warn
          overwrite: true
          retention-days: 2

      # N12(f): one picture per shipped preset per renderer (40), each with the before/after hashes that must
      # match bit for bit, so a saved look that changes when it is reopened is visible without the full bundle.
      - name: Publish the preset round trip (N12(f))
        if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: preset-roundtrip-n12f
          path: ${{ runner.temp }}/phase1-visual-review/preset-roundtrip
          if-no-files-found: warn
          overwrite: true
          retention-days: 2

      # The perf gate (P3 #3): --bench runs the app's own render loop at 1080p for two budgeted scenes (and, with --bench-ar,
      # a third: the AR overlay over a synthetic 60 fps camera) and
      # writes how long every frame took. A runner has no graphics card, so the stage is drawn by WARP and the
      # absolute budgets (p95 < 8 ms for the default look, < 16 ms for the busiest one) do not apply there — the
      # app says so itself instead of failing. What a runner can still judge is the change against the previous
      # run on the same kind of machine, which is what the cache carries from one run to the next.
      - name: Restore the previous frame-time report
        id: perf-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/perf-baseline
          key: keyflow-perf-${{ github.run_id }}
          restore-keys: keyflow-perf-

      - name: Measure the frame budget
        id: bench
        shell: pwsh
        run: |
          $exe = 'bin/Release/net10.0-windows/PianoPath.exe'
          $out = Join-Path $env:RUNNER_TEMP 'keyflow-bench.json'
          $log = Join-Path $env:RUNNER_TEMP 'keyflow-bench.log'
          $previous = Join-Path $env:RUNNER_TEMP 'perf-baseline/keyflow-bench.json'
          $arguments = @('--bench=90', '--bench-ar', "--bench-out=$out")
          if (Test-Path $previous) { $arguments += "--bench-baseline=$previous" }
          # The gate prints its own lines (NOTE/PASS/WARN/FAIL perf: …) and the report is the JSON beside them.
          # A window app has no console of its own, so stdout is redirected to read those lines back.
          $proc = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -Wait -NoNewWindow -RedirectStandardOutput $log
          $lines = if (Test-Path $log) { @(Get-Content $log | Where-Object { $_.Trim() }) } else { @() }
          if (-not $lines) { $lines = @("the benchmark printed nothing and exited with code $($proc.ExitCode)") }
          foreach ($line in $lines) {
            $text = $line -replace '%', '%25'
            if ($line -like 'FAIL*') { "::error title=Keyflow frame budget::$text" }
            elseif ($line -like 'WARN*') { "::warning title=Keyflow frame budget::$text" }
            else { "::notice title=Keyflow frame budget::$text" }
          }
          @('# Keyflow frame budget', '```', $lines, '```') | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          # Exit 3 is a budget exceeded, which the app only answers on a machine with a real graphics card; a
          # runner draws with WARP and gets NOTE lines instead. Exit 2 means no Direct3D device was found at
          # all, which no step after this one could survive either.
          exit $proc.ExitCode

      - name: Publish the frame-time report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-bench-report
          path: ${{ runner.temp }}/keyflow-bench.json
          if-no-files-found: warn

      # The baseline the next run compares with. It lives in the Actions cache rather than in the tree: a
      # measurement committed into the repository would change on every run (and docs/previews holds pictures
      # only, precisely because CI commits whatever is inside it). The key carries the run id rather than the
      # commit sha, so building one commit twice cannot collide with itself, and `restore-keys` above picks the
      # most recent entry — which is what "the previous run on the same kind of runner" means.
      - name: Keep this run as the next baseline
        id: perf-keep
        if: always()
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'perf-baseline'
          $report = Join-Path $env:RUNNER_TEMP 'keyflow-bench.json'
          # A run that wrote no report must not save a baseline at all. The cache is read back by prefix and the
          # most recent entry wins, so an empty one hides the last real measurement from every run after it:
          # that is what happened when a failed run left the next one reporting "no previous measurement to
          # compare with" even though two earlier runs had measured the same scenes.
          if (Test-Path $report) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item -Force $report (Join-Path $folder 'keyflow-bench.json')
            'have_report=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            '::warning title=Keyflow frame budget::No report was written, so the previous baseline stays the one the next run compares with.'
          }

      # Saving is best effort: a pull request from a fork gets a read-only cache scope and cannot write one,
      # which costs that run its baseline and nothing else.
      - name: Save the frame-time baseline
        if: always() && steps.perf-keep.outputs.have_report == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/perf-baseline
          key: keyflow-perf-${{ github.run_id }}

      # The wizard is part of the product, so it is compiled on every push instead of only when a
      # release is cut: this is the only place the real ISCC runs, and tools/build_installer.ps1
      # refuses to let the compiler ignore a name or a placeholder the translation got wrong.
      # -Stub writes only a placeholder executable into publish\win-x64; the 748 MB sample library
      # is never needed to compile an installer because it is downloaded after installation.
      - name: Build the installer
        shell: pwsh
        run: pwsh tools/build_installer.ps1 -Stub -OutputDir (Join-Path $env:RUNNER_TEMP 'keyflow-installer')

      # The README shows the real application, so the screenshots are rendered by the same executable
      # that just passed the verification suite instead of being hand-made artwork that drifts out of
      # date. Refresh the committed copies with:
      #   gh run download <run-id> -n keyflow-previews -D docs/previews   # both language sets
      - name: Render README previews
        id: render-previews
        shell: pwsh
        run: |
          $exe = 'bin/Release/net10.0-windows/PianoPath.exe'
          $out = 'docs/previews'
          # Two sets of the same subjects, one per language: README.md reads docs/previews/vi and
          # README.en.md reads docs/previews/en, so each edition shows the interface in its own language.
          # --lang pins it either way, because a runner whose Windows display language happens to be
          # something else must still render the same pictures as every other machine.
          $shots = @(
            # The stage every run shows is the Direct3D 11 engine now; on a runner without a graphics
            # card this is WARP, Windows' software rasterizer: slower, but pixel-for-pixel the same shaders.
            @{ Name = 'stage-live.png';  Args = @('--play-preview') },
            # The same stage under the GPU engine's own name, the picture the README's GPU section embeds.
            # A held chord rather than the single note of stage-live: since the GPU engine became the
            # default the two shots rendered the very same picture, so this one now shows what a held
            # chord looks like on the default look — the hold effects linking the pressed keys.
            @{ Name = 'stage-gpu.png';   Args = @('--play-preview', '--play-chord', '--gpu') },
            # Two looks that exercise the effect families the GPU engine draws: trails, ambient layers,
            # arcs between held keys, impact morphs and key labels. A held chord shows the hold effects.
            @{ Name = 'stage-gpu-galaxy.png'; Args = @('--play-preview', '--play-chord', '--gpu', '--preset=GalaxyVoyage') },
            @{ Name = 'stage-gpu-storm.png';  Args = @('--play-preview', '--play-chord', '--gpu', '--preset=ElectricStorm') },
            # The background page draws a picture of your own behind the keys. The README shows that
            # feature with the generated sample from docs/samples, never with a visitor's screenshot: the
            # shot stays deterministic and the repo stays free of artwork somebody else holds the rights to.
            @{ Name = 'background-image.png'; Args = @('--play-preview', "--background-image=$(Join-Path $PWD 'docs/samples/stage-backdrop.png')") },
            @{ Name = 'main-menu.png';   Args = @('--menu') },
            @{ Name = 'design-dock.png'; Args = @('--show-settings', '--settings-tab=style') },
            @{ Name = 'theme-dock.png';  Args = @('--show-settings', '--settings-tab=theme') },
            # The three SESSION pages. The group owns real features (practice tempo, the history chart
            # and its ghosts, the recording formats) yet had no picture of its own anywhere in the
            # README, so a reader could only guess what the pages look like. The History page of a
            # pristine first run is its empty state, which is exactly what a new install shows.
            @{ Name = 'practice-dock.png';  Args = @('--show-settings', '--settings-tab=practice') },
            @{ Name = 'history-dock.png';   Args = @('--show-settings', '--settings-tab=history') },
            @{ Name = 'recording-dock.png'; Args = @('--show-settings', '--settings-tab=recording') },
            @{ Name = 'play-dialog.png'; Args = @('--play-dialog') },
            @{ Name = 'shortcuts.png';   Args = @('--shortcuts') },
            # The page that owns the interface language, so each set shows that language in the app itself.
            @{ Name = 'language-dock.png'; Args = @('--show-settings', '--settings-tab=general') }
          )
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Where the app writes one line per picture (App.ReportPreview): a hash of the PNG, how the capture
          # was reached and what drew the stage. Outside docs/previews on purpose. Everything inside that
          # folder is committed, and a line holding a measured duration would change the commit on every run.
          $reports = Join-Path $env:RUNNER_TEMP 'preview-reports'
          Remove-Item -Recurse -Force $reports -ErrorAction SilentlyContinue
          $env:KEYFLOW_PREVIEW_REPORTS = $reports
          $failed = @()
          foreach ($lang in @('en', 'vi')) {
            foreach ($shot in $shots) {
              $name = "$lang/$($shot.Name)"
              $target = Join-Path $out $name
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              # A private settings folder per shot: the README must show a pristine first run, never the
              # leftovers of the verification suite that ran before it in this job.
              $settings = Join-Path $env:TEMP "keyflow-preview-$lang-$([IO.Path]::GetFileNameWithoutExtension($shot.Name))"
              Remove-Item -Recurse -Force $settings -ErrorAction SilentlyContinue
              $args = @('--snapshot', $target, '--compact', "--lang=$lang", "--settings-dir=$settings") + $shot.Args
              $proc = Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait
              # docs/previews is owned by this step, so a picture may be one commit behind the README
              # line that introduces it.
              if (Test-Path $target) { "rendered $name ($([math]::Round((Get-Item $target).Length / 1KB)) KB)" }
              else { $failed += "$name (exit $($proc.ExitCode))" }
            }
          }
          if ($failed.Count) { "::error title=Keyflow previews::$($failed -join ', ') was not written"; exit 1 }
          # One annotation per language with a line per picture. The hash of each PNG is what lets two runs be
          # compared without waiting for the commit step. Per language, not one for all: GitHub cuts an annotation
          # at exactly 4096 characters, and 22 lines of about 300 do not fit (the first run lost eight of them).
          # A finished run's job log cannot be read afterwards; annotations can.
          # (A diagnostic must not fail the step, and pwsh stops on the first error here: hence SilentlyContinue.)
          foreach ($lang in @('en', 'vi')) {
            $lines = Get-ChildItem -Path $reports -Filter "$lang-*.txt" -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }
            "::notice title=Preview capture ($lang)::$($lines -join '%0A')"
          }
          Remove-Item Env:KEYFLOW_PREVIEW_REPORTS

          # The property everything above depends on, checked where it can be seen: render three of the pictures
          # a second time, from the same executable and a fresh settings folder, and compare the bytes. Two
          # renders of the same code that disagree mean the committed pictures will keep changing and the drift
          # check below cannot be trusted. A warning, not a failure: it says the renderer is noisy, which is not
          # something the author of a pull request can act on. One picture of each kind: the GPU stage with a held
          # chord, the settings dock over the stage, and the main menu with its backdrop.
          $unstable = @()
          $recheck = Join-Path $env:RUNNER_TEMP 'preview-recheck'
          Remove-Item -Recurse -Force $recheck -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $recheck | Out-Null
          foreach ($name in @('stage-gpu-galaxy.png', 'theme-dock.png', 'main-menu.png')) {
            $shot = $shots | Where-Object { $_.Name -eq $name }
            $first = Join-Path $out "en/$name"
            $again = Join-Path $recheck "again-$name"
            $settings = Join-Path $env:TEMP "keyflow-preview-again-$([IO.Path]::GetFileNameWithoutExtension($name))"
            Remove-Item -Recurse -Force $settings -ErrorAction SilentlyContinue
            $args = @('--snapshot', $again, '--compact', '--lang=en', "--settings-dir=$settings") + $shot.Args
            Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait | Out-Null
            if (-not (Test-Path $again)) { $unstable += "$name (no second picture)"; continue }
            $hashFirst = (Get-FileHash $first).Hash.Substring(0, 12).ToLower()
            $hashAgain = (Get-FileHash $again).Hash.Substring(0, 12).ToLower()
            if ($hashFirst -ne $hashAgain) {
              $unstable += "$name (sha $hashFirst, then $hashAgain)"
              Copy-Item -Force $first (Join-Path $recheck "first-$name")
            }
          }
          if ($unstable.Count) {
            "::warning title=Previews are not reproducible::A second render of $($unstable -join '; ') differs from the first byte for byte, so the committed pictures will keep changing and the drift check cannot be trusted. Both renders are in the keyflow-preview-recheck artifact."
            "unstable=true" >> $env:GITHUB_OUTPUT
          }
          else { "::notice title=Previews are reproducible::A second render of three pictures matched the first byte for byte." }

      # Every shipped built-in and community look, drawn by both engines side by side (software | Direct3D 11),
      # in docs/previews/presets.jpg. It is how renderer changes are checked against each curated recipe, and
      # tools/check_sources.py keeps the gallery in sync with both source lists.
      - name: Render the preset gallery
        id: render-gallery
        shell: pwsh
        run: |
          $exe = 'bin/Release/net10.0-windows/PianoPath.exe'
          $presets = @('ConcertGold', 'NeonViolet', 'TwoHands', 'ClassicRoll', 'GreenScreen', 'Inferno', 'IceCrystal', 'SakuraNocturne', 'MoonlightSonata', 'AuroraRainbow', 'OceanDepths', 'GalaxyVoyage', 'ElectricStorm', 'RetroArcade', 'EmberRain', 'Lo-FiStudy', 'SunsetDrive', 'PrismFlowPreview', 'PrismFlow-Wisps', 'PrismFlow-Flames')
          $work = Join-Path $env:TEMP 'keyflow-gallery'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          foreach ($preset in $presets) {
            foreach ($engine in @('sw', 'gpu')) {
              $target = Join-Path $work "$preset-$engine.png"
              $settings = Join-Path $work "settings-$preset-$engine"
              $args = @('--snapshot', $target, '--compact', '--lang=en', "--settings-dir=$settings", '--play-preview', '--play-chord', "--preset=$preset")
              # The GPU engine is the stage of every run now; --software is the WPF renderer's one-run
              # escape hatch, so the gallery still checks both engines against each other.
              if ($engine -eq 'gpu') { $args += '--gpu' } else { $args += '--software' }
              Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait | Out-Null
              if (-not (Test-Path $target)) { "::warning title=Preset gallery::$preset ($engine) was not rendered" }
            }
          }
          Add-Type -AssemblyName System.Drawing
          $cellW = 540; $cellH = 350; $label = 26
          $sheet = New-Object System.Drawing.Bitmap ($cellW * 2), (($cellH + $label) * $presets.Count)
          $g = [System.Drawing.Graphics]::FromImage($sheet)
          $g.Clear([System.Drawing.Color]::FromArgb(12, 12, 16))
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $font = New-Object System.Drawing.Font 'Segoe UI', 11
          $brush = [System.Drawing.Brushes]::White
          for ($i = 0; $i -lt $presets.Count; $i++) {
            $y = $i * ($cellH + $label)
            $col = 0
            foreach ($engine in @('sw', 'gpu')) {
              $g.DrawString("$($presets[$i]) - $(if ($engine -eq 'sw') { 'software' } else { 'GPU (WARP)' })", $font, $brush, ($col * $cellW + 8), ($y + 4))
              $file = Join-Path $work "$($presets[$i])-$engine.png"
              if (Test-Path $file) {
                $img = [System.Drawing.Image]::FromFile($file)
                $g.DrawImage($img, (New-Object System.Drawing.Rectangle ($col * $cellW), ($y + $label), $cellW, $cellH))
                $img.Dispose()
              }
              $col++
            }
          }
          $g.Dispose()
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $params = New-Object System.Drawing.Imaging.EncoderParameters 1
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 84L
          New-Item -ItemType Directory -Force -Path 'docs/previews' | Out-Null
          $sheet.Save((Join-Path $PWD 'docs/previews/presets.jpg'), $codec, $params)
          $sheet.Dispose()
          "preset gallery: $([math]::Round((Get-Item 'docs/previews/presets.jpg').Length / 1KB)) KB"

      # The left/right pair is the WPF and GPU path; each 540×350 cell is exactly half of the 1080×700
      # compact capture, so outline/facet readability is checked at 50%, not inferred from full-size art.
      - name: Render the note-material gallery at 50%
        id: render-note-styles
        shell: pwsh
        run: |
          $exe = 'bin/Release/net10.0-windows/PianoPath.exe'
          $styles = @(
            @{ Id = 'Solid-2D'; Style = 'Solid'; Depth = '2d' }
            @{ Id = 'Solid-3D'; Style = 'Solid'; Depth = '3d' }
            @{ Id = 'Glass-2D'; Style = 'Glass'; Depth = '2d' }
            @{ Id = 'Glass-3D'; Style = 'Glass'; Depth = '3d' }
            @{ Id = 'Neon'; Style = 'Neon'; Depth = '2d' }
            @{ Id = 'Fire'; Style = 'Fire'; Depth = '2d' }
            @{ Id = 'Gem-2D'; Style = 'Gem'; Depth = '2d' }
            @{ Id = 'Gem-3D'; Style = 'Gem'; Depth = '3d' }
            @{ Id = 'Crystal-Outline'; Style = 'CrystalOutline'; Depth = '2d' }
          )
          $engines = @('sw', 'gpu')
          $work = Join-Path $env:TEMP 'keyflow-note-styles-gallery'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          foreach ($style in $styles) {
            foreach ($engine in $engines) {
              $target = Join-Path $work "$($style.Id)-$engine.png"
              $settings = Join-Path $work "settings-$($style.Id)-$engine"
              $args = @('--snapshot', $target, '--compact', '--lang=en', "--settings-dir=$settings", '--play-preview', '--play-chord', '--preset=ConcertGold', "--note-style=$($style.Style)", "--note-depth=$($style.Depth)")
              if ($engine -eq 'gpu') { $args += '--gpu' } else { $args += '--software' }
              $process = Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait
              if ($process.ExitCode -ne 0 -or -not (Test-Path $target)) { throw "Note-style capture failed: $($style.Id) ($engine), exit $($process.ExitCode)" }
            }
          }
          Add-Type -AssemblyName System.Drawing
          $cellW = 540; $cellH = 350; $label = 26
          $sheet = New-Object System.Drawing.Bitmap ($cellW * 2), (($cellH + $label) * $styles.Count)
          $g = [System.Drawing.Graphics]::FromImage($sheet)
          $g.Clear([System.Drawing.Color]::FromArgb(12, 12, 16))
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $font = New-Object System.Drawing.Font 'Segoe UI', 11
          $brush = [System.Drawing.Brushes]::White
          for ($i = 0; $i -lt $styles.Count; $i++) {
            $y = $i * ($cellH + $label)
            $col = 0
            foreach ($engine in $engines) {
              $engineLabel = if ($engine -eq 'sw') { 'WPF / software' } else { 'GPU (WARP)' }
              $g.DrawString("$($styles[$i].Id) — $engineLabel", $font, $brush, ($col * $cellW + 8), ($y + 4))
              $file = Join-Path $work "$($styles[$i].Id)-$engine.png"
              $img = [System.Drawing.Image]::FromFile($file)
              $g.DrawImage($img, (New-Object System.Drawing.Rectangle ($col * $cellW), ($y + $label), $cellW, $cellH))
              $img.Dispose()
              $col++
            }
          }
          $g.Dispose()
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $params = New-Object System.Drawing.Imaging.EncoderParameters 1
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 88L
          New-Item -ItemType Directory -Force -Path 'docs/previews' | Out-Null
          $sheet.Save((Join-Path $PWD 'docs/previews/note-styles.jpg'), $codec, $params)
          $sheet.Dispose()
          "note-style gallery (50%): $([math]::Round((Get-Item 'docs/previews/note-styles.jpg').Length / 1KB)) KB"

      - name: Upload README previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-previews
          path: |
            docs/previews/**/*.png
            docs/previews/presets.jpg
            docs/previews/note-styles.jpg
          if-no-files-found: warn
          overwrite: true
          retention-days: 2

      # Only when the second render disagreed with the first: both pictures, so the difference can be
      # located pixel by pixel instead of guessed at.
      - name: Upload the pictures that did not reproduce
        if: steps.render-previews.outputs.unstable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-preview-recheck
          path: ${{ runner.temp }}/preview-recheck/*.png
          if-no-files-found: warn

      # The workflow renders every file it lists in $shots, so `tools/check_sources.py` lets a README
      # reference a preview that this commit has not rendered yet (see scan_readme).
      #
      # Publish the screenshots with the change that produced them. The step is skipped for pull
      # requests (the checkout is a merge commit then) and for runs triggered by its own commit, so a
      # refresh can never loop.
      #
      # A branch that only takes pull requests (a repository rule the workflow's own token cannot bypass)
      # declines the push with GH013. Nothing is wrong with the build then, so that one rejection is
      # reported as a warning instead of turning the job red, and the renders are still in the
      # keyflow-previews artifact. Every other push failure (network, authentication) still fails the
      # step. bash rather than pwsh because the decision needs git's exit code and its message side by
      # side.
      #
      # A branch that moved *while this job rendered* is not one of those failures any more. Two runs of
      # main overlap by design (main never cancels a running build, so the preview commit that belongs to
      # a merge people are already reading is not thrown away), and a newer push lands its own refresh
      # while an older run is still rendering: on 2026-10-16 run 38878121563 started from `e4ea5e36` at
      # 09:05 and the run before it pushed `0ff9d1b` at 09:08. That run then committed its screenshots and
      # `git pull --rebase` stopped on the first file both runs had touched — both normalise the same
      # manifests, compact the same PNGs and re-render the same screenshots, and renders are not
      # byte-stable between runners — so the job went red with the distributable-build check still to run.
      # A branch that moved is not a reason to fail, and the screenshots this run rendered must not
      # overwrite the branch's: they show the interface of the commit this run built, which is no longer
      # the tip, while the set on the branch came from the newer tip. The step therefore leaves a branch
      # that moved alone, says so as a warning, and keeps its own pictures in the artifact.
      - name: Commit refreshed previews
        id: commit-previews
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python -c 'import json,pathlib; ps=[pathlib.Path("docs/evidence")/p/"manifest.json" for p in ("held-light-isolation","held-particle-controls","wisps-v3","flames-v3")]; [(p.write_text(json.dumps(json.loads(p.read_text(encoding="utf-8-sig")),ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")) for p in ps]'
          python tools/compact_native_review_pngs.py --root .
          if [ "$?" -ne 0 ]; then exit 1; fi
          git config user.name 'keyflow previews'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/previews docs/evidence/held-particle-art docs/evidence/held-particle-controls docs/evidence/held-light-isolation docs/evidence/wisps-v3 docs/evidence/flames-v3 docs/evidence/ar-particle-alignment docs/evidence/embers-art-v1 docs/evidence/embers-art-v2 docs/evidence/splash-art-v1 docs/evidence/fireworks-art-v1 docs/evidence/confetti-art-v1 docs/evidence/dust-art-v1 docs/evidence/dust-art-v2 docs/evidence/shatter-art-v1 docs/evidence/shatter-billboard-v1 docs/evidence/melt-art-v1 docs/evidence/bounce-art-v1 docs/evidence/release-float-up-v1 docs/evidence/release-dissolve-v1 docs/evidence/release-smoke-v1
          if git diff --cached --quiet; then
            echo "docs/previews is already up to date."
            echo 'landed=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh the README previews from CI [skip ci]"
          log="$RUNNER_TEMP/previews-push.log"
          # The independent key-light job may have published its validated docs while this job rendered,
          # and so may a newer run of main (see the comment above the step). `git pull --rebase` stopped on
          # the first file two runs had both touched and turned run 38878121563 red on 2026-10-16 with the
          # distributable-build check still to run. No replay and no overwrite: when the tip is no longer
          # the commit this run built, the branch keeps its own screenshots — they belong to the newer tip
          # — and this run's are still in the keyflow-previews artifact. A tip that cannot be read (the
          # fetch below fails loudly) and a tip that moves again between that fetch and the push (git
          # reports a non-fast-forward rejection, handled below) both get the same warning.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          tip=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::warning title=Previews not committed::The branch moved while this build rendered (now $tip, this run built $GITHUB_SHA), so the screenshots it re-rendered were not pushed. The branch keeps the set that belongs to its newer tip; these pictures are in the keyflow-previews artifact of this run."
            echo 'landed=superseded' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if git push >"$log" 2>&1; then
            cat "$log"
            # 'landed' means the pictures are on the branch, not merely committed on this runner: the
            # drift check below reads it, and a local commit whose push was declined has to count as
            # not landed or the drift goes quiet while it is still there.
            echo 'landed=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$log"
          if grep -Eqi 'GH013|repository rule violations|protected branch' "$log"; then
            echo "::warning title=Previews not committed::The branch only accepts pull requests, so the refreshed screenshots were not pushed. They are in the keyflow-previews artifact of this run."
            # 'landed' stays unset on purpose: nothing newer is on the branch, so the drift check
            # below still reports the README as stale. Only a branch that moved has newer pictures.
            exit 0
          fi
          # The tip can also move between the fetch above and this push; git then reports a plain
          # non-fast-forward rejection, which is the same race and gets the same answer.
          if grep -Eqi 'non-fast-forward|fetch first|stale info|cannot lock ref' "$log"; then
            echo "::warning title=Previews not committed::The branch moved again while this build was pushing, so the screenshots it re-rendered were not pushed. The branch keeps the set that belongs to its newer tip; these pictures are in the keyflow-previews artifact of this run."
            echo 'landed=superseded' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

      # Freshness is the one thing the static checker cannot see: `scan_readme` only proves a preview
      # exists and is named in $shots, so a screenshot that still shows last month's interface keeps the
      # build green. That is what happened between de75f93 and the Quick Adjust / GPU atmosphere changes
      # — the branch rules stopped the preview push above, and nothing in the repo said so.
      #
      # Two traps, both found by running this in CI rather than by reasoning about it:
      #
      #   * The renders are not byte-stable between runners, so every file under docs/previews differs
      #     from the checkout even when no interface moved: run 36834861621 named all 23, and 106 of this
      #     repo's 349 commits are preview refreshes. So "did this build re-render anything" is not the
      #     question — nearly always yes — and asking it warns on every run.
      #   * `git status` is not the drift report either, because the step above commits before it pushes.
      #     A declined push (GH013) leaves the tree clean while the branch still carries the old pictures,
      #     and the check went quiet on run 36836190788 with the drift exactly as unresolved as before.
      #
      # So: diff the working tree against $GITHUB_SHA, the commit this run started from, to see what the
      # build re-rendered (README sets, preset gallery and note-material gallery), and ask the commit step whether that refresh actually *landed* on the branch.
      # Only "re-rendered and not landed" is drift worth reporting; a landed refresh, a refresh the branch
      # already has from a newer run and an untouched folder all get a plain line. A warning rather than an
      # error on purpose: with the branch rules in place the workflow's own token cannot push, so making it
      # red would paint every pull request red for a thing only a human — or a bypass rule — can settle.
      - name: Report preview drift
        if: always() && steps.render-previews.outcome == 'success' && steps.render-gallery.outcome == 'success' && steps.render-note-styles.outcome == 'success'
        shell: bash
        run: |
          drifted=$(git diff --name-only "$GITHUB_SHA" -- docs/previews)
          if [ -z "$drifted" ]; then
            echo "This build rendered the same pictures the branch already carries."
            exit 0
          fi
          count=$(printf '%s\n' "$drifted" | wc -l | tr -d ' ')
          names=$(printf '%s\n' "$drifted" | sed 's|^docs/previews/||' | paste -sd, - | sed 's/,/, /g')
          if [ '${{ steps.commit-previews.outputs.landed }}' = 'true' ]; then
            echo "This build re-rendered $count file(s) and the step above committed them to the branch."
            exit 0
          fi
          if [ '${{ steps.commit-previews.outputs.landed }}' = 'superseded' ]; then
            echo "::notice title=Previews left to the newer tip::This build re-rendered $count file(s), but the branch had already moved, so the set that belongs to its newer tip was kept and these pictures are in the keyflow-previews artifact of this run. Re-run this workflow from the tip if its screenshots look stale."
            exit 0
          fi
          {
            echo '## docs/previews does not match this build'
            echo
            echo "This build re-rendered $count screenshot(s) and none of them reached the branch, so the README is still showing the older interface:"
            echo
            printf '%s\n' "$drifted" | sed 's|^|- `|; s|$|`|'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::warning title=Previews are stale::$count file(s) under docs/previews were re-rendered by this build and not committed ($names). Refresh them from the keyflow-previews artifact of this run."

      # The sheets were staged right after the suite; this is the push. It is its own step at the end of the job
      # because every run of this branch also receives the keyboard-light job's evidence commit a few minutes in,
      # so a step gated on "the tip is still the commit I built" - the rule the other evidence steps follow -
      # would skip every single time. These seven files are new and nothing else writes them, so replaying one
      # commit onto the moved tip is safe; when the replay actually conflicts (another run wrote different
      # sheets) the step aborts it, says so, and leaves the branch alone.
      - name: Save the review contact sheets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          git config user.name 'keyflow previews'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/n12-sheets docs/evidence/refraction-sheets docs/evidence/ar-material-sheets docs/evidence/ar-effect-sheets
          if git diff --cached --quiet; then
            echo "The branch already carries these sheets."
            exit 0
          fi
          git commit -m 'Refresh the review contact sheets [skip ci]'
          base=$(git rev-parse HEAD~1)
          log="$RUNNER_TEMP/review-sheets-push.log"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          tip=$(git rev-parse "origin/$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -n "$tip" ] && [ "$tip" != "$base" ]; then
            if ! git -c rebase.autoStash=true rebase "$tip" >"$log" 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              cat "$log"
              echo "::warning title=Review sheets not committed::The branch moved and replaying the sheet commit onto it conflicted, so the branch keeps the sheets it already has. The next run writes them again from its own review."
              exit 0
            fi
          fi
          if git push >"$log" 2>&1; then cat "$log"; exit 0; fi
          cat "$log"
          if grep -Eqi 'GH013|repository rule violations|protected branch|non-fast-forward|fetch first|stale info|cannot lock ref' "$log"; then
            echo "::warning title=Review sheets not committed::The branch would not take the sheets push, so it keeps the set it already has."
            exit 0
          fi
          exit 1

      # The packaging path is the one thing none of the steps above touch: this job builds and verifies
      # bin/, while a release ships publish/ — a single file, an installer compiled from that folder, a
      # ZIP of it. publish.ps1 had therefore never run anywhere before the release itself, which is what
      # docs/REPO-AUDIT.md §5.3 names as the last blind spot of the checker: a defect in the script would
      # have been found by the person cutting the release, at the moment they cut it.
      #
      # It publishes the framework-dependent kind, which downloads no runtime pack and takes a couple of
      # minutes. The assertions after it exercise the actual package path: the executable, the MIT licence,
      # the absence of bundled piano samples, and the ZIP that -Zip promised.
      - name: Publish a distributable build
        shell: pwsh
        run: |
          .\publish.ps1 -Mode FrameworkDependent -Runtime win-x64 -Zip
          $folder = 'publish/win-x64-fd'
          foreach ($file in @("$folder/PianoPath.exe", "$folder/LICENSE.txt")) {
            if (-not (Test-Path $file)) {
              "::error title=Published package::$file is missing from the published folder"
              throw "$file was not published"
            }
          }
          $sf2 = @(Get-ChildItem $folder -Filter '*.sf2' -File -Recurse -ErrorAction SilentlyContinue)
          if ($sf2.Count -gt 0) { throw "Unexpected SF2 file in package: $($sf2[0].FullName)" }
          $zip = Get-ChildItem publish -Filter 'Keyflow-*-win-x64-fd.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { throw 'publish.ps1 -Zip wrote no Keyflow-*-win-x64-fd.zip into publish/' }
          # The last link of the version chain, checked against the binary a user would actually run:
          # <Version> in the project file, which AppInfo reads back and which the SDK stamps into the
          # executable's version resource. A package named after one version and containing another is
          # the defect this whole step exists for.
          $node = Select-Xml -Path PianoPath.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1
          $version = if ($node) { $node.Node.InnerText.Trim() } else { '' }
          if (-not $version) { throw 'PianoPath.csproj has no <Version>, so there is nothing to compare the package with' }
          $exe = Get-Item "$folder/PianoPath.exe"
          $stamped = "$($exe.VersionInfo.ProductVersion)"
          if (-not $stamped.StartsWith($version)) {
            throw "the published executable reports version '$stamped' while PianoPath.csproj declares '$version'"
          }
          if ($zip.Name -notlike "Keyflow-$version-*") { throw "the ZIP is named $($zip.Name), which does not carry the version $version" }
          "published $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB); the executable is $([math]::Round($exe.Length / 1MB, 1)) MB at version $stamped"
