name: build

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

# The preview step commits the freshly rendered screenshots back to the branch it built, which keeps
# docs/previews in step with the interface without anyone copying files around by hand. A branch that
# only takes pull requests declines that push; the step then warns instead of failing (see below).
permissions:
  contents: write

jobs:
  # Fast lane: syntax, XAML resources, the settings-navigation catalogue, the theme tokens, the string tables,
  # the installer translation and every README link are checked in about ten seconds on a Linux runner, so a typo
  # turns red before the Windows job is even scheduled. The whole job is one script, which is why it can run on a
  # machine that has nothing but Python.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Static source check
        run: python3 tools/check_sources.py

  # Second lane: the checks that used to live only inside `--verify`, which means they could only run on
  # a Windows runner and could not be run one at a time. tests/PianoPath.Tests links the sources that
  # need neither WPF nor WinMM (MIDI, MusicXML, the hand-split guess, the meter table, the WAV writer,
  # the string table) and runs them under xUnit on plain net10.0, so a MIDI regression goes red here in
  # about a minute without waiting for a Windows runner to be free. It runs beside `build` rather than
  # in front of it: both only need `static`, and neither is a prerequisite for the other.
  test:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run the portable test project
        run: >-
          dotnet test tests/PianoPath.Tests/PianoPath.Tests.csproj
          --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory "$RUNNER_TEMP/test-results"

      # A red run has to name the test that went red. The console logger prints that, but a job log is
      # only readable while somebody is watching it, and this project exists precisely so a regression
      # can be diagnosed from a phone. So the failures are read back out of the TRX and published as
      # annotations, which stay queryable through the API long after the log is awkward to reach.
      - name: Name the tests that failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'test-results') -Filter *.trx -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $trx) { 'No test results were written.'; exit 0 }
          [xml]$run = Get-Content $trx.FullName
          $summary = $run.TestRun.ResultSummary
          $counters = $summary.Counters
          "outcome $($summary.outcome): $($counters.passed) passed, $($counters.failed) failed, $($counters.notExecuted) not executed, $($counters.total) total"
          @(
            '# Portable test project'
            ''
            "Outcome **$($summary.outcome)** — $($counters.passed) passed, $($counters.failed) failed, $($counters.notExecuted) not executed of $($counters.total)."
          ) | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          foreach ($test in @($run.TestRun.Results.UnitTestResult)) {
            if ($test.outcome -ne 'Failed') { continue }
            $detail = "$($test.Output.ErrorInfo.Message) $($test.Output.ErrorInfo.StackTrace)" -replace '\s+', ' '
            if ($detail.Length -gt 800) { $detail = $detail.Substring(0, 800) + '…' }
            $text = "$($test.testName) — $detail" -replace '%', '%25'
            "::error title=Test failed::$text"
          }

  build:
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The bundled SoundFont lives in Git LFS; the build itself only needs the pointer, so skip the 113 MiB download.
          # The verification suite detects the pointer and reports SKIP for the bundled-piano checks.
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PianoPath.csproj

      - name: Build
        run: dotnet build PianoPath.csproj --configuration Release --no-restore

      # Runs on every push and blocks the build. The suite detects what the runner is missing
      # (no Git LFS SoundFont, no audio device, an unopenable MIDI port) and reports those as
      # SKIP/NOTE instead of failing, so a red step here means a real regression.
      # Every log line is also echoed into the job summary; annotations stay under GitHub's
      # 10-per-level cap by only surfacing SKIP/NOTE/FAIL plus the final summary line.
      - name: Verification suite
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'keyflow-verification.log'
          $proc = Start-Process -FilePath 'bin/Release/net10.0-windows/PianoPath.exe' -ArgumentList "--verify","--verify-log=$log" -PassThru -Wait
          $lines = if (Test-Path $log) { Get-Content $log } else { @() }
          # A child process that reports every stage it reaches can print more NOTE lines than GitHub will
          # show, and the ones that matter are the last ones — the step the machine stopped at. So only the
          # tail of the NOTEs is surfaced: SKIP and FAIL lines always are, and the whole log is in the job
          # summary and in the run's artifacts either way.
          $notes = @($lines | Where-Object { $_ -like 'NOTE*' })
          $tail = @($notes | Select-Object -Last 6)
          # A FAIL line is this run's own failure, with one exception. The MP4 take is written by a child
          # process, and the suite copies that child's lines into the log in the machine's own words — FAIL lines
          # and all, since they are what says where the machine stopped. The suite's own answer to them is a SKIP
          # line that names the step the child stopped at word for word (see Diagnostics/Mp4TakeAttempt.cs). So a
          # FAIL line that appears inside a SKIP line was written by the machine's child process and not by the
          # suite: the suite has already ruled on that step, and annotating it as an error put a red mark on
          # green runs whose only trouble was a take this machine cannot write. The line is still in the job
          # summary and in the artifact, right where the suite answers it.
          $skipLines = @($lines | Where-Object { $_ -like 'SKIP*' }) -join "`n"
          $lines | ForEach-Object {
            if ($_ -like 'FAIL*') { if ($skipLines.Contains($_)) { return }; $level = 'error' }
            elseif ($_ -like 'SKIP*') { $level = 'warning' }
            elseif ($_ -like 'NOTE*') { if ($_ -notin $tail) { return }; $level = 'warning' }
            elseif ($_ -like 'Verification passed*' -or $_ -like 'Verification failed*') { $level = 'notice' }
            else { return }
            $text = $_ -replace '%', '%25'
            "::${level} title=Keyflow verification::$text"
          }
          # The exit code and the very last line of the log are named whatever the log says: a run that is
          # taken down inside a native call never reaches the suite's own verdict, and then the last line is the
          # only thing that says where the process died.
          $last = if ($lines) { $lines[-1] } else { '<the log was empty>' }
          "::notice title=Keyflow verification::PianoPath.exe exited with code $($proc.ExitCode) after $($lines.Count) log line(s)."
          if (-not $lines) { "::error title=Keyflow verification::PianoPath.exe did not write $log" }
          elseif ($last -notlike 'Verification passed*' -and $last -notlike 'Verification failed*') {
            $text = $last -replace '%', '%25'
            "::error title=Keyflow verification::The log ends without a verdict, at: $text"
          }
          @('# Keyflow verification suite', '```', $lines, '```') | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $proc.ExitCode

      # GitHub shows at most ten annotations of one level, and a run whose child process reports its stages
      # line by line has more NOTEs than that: the lines that matter are the ones near the end. So the step
      # above leaves the older NOTEs to the job summary, and this one keeps the whole log as an artifact —
      # the only way to read a run back later, since the annotations that overflowed cannot be recovered
      # from the API.
      - name: Publish the verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-verification-log
          path: ${{ runner.temp }}/keyflow-verification.log
          if-no-files-found: warn

      # The wizard is part of the product, so it is compiled on every push instead of only when a
      # release is cut: this is the only place the real ISCC runs, and tools/build_installer.ps1
      # refuses to let the compiler ignore a name or a placeholder the translation got wrong.
      # -Stub writes placeholder files into publish\win-x64 so the job never needs the 113 MiB
      # SoundFont, which the compiler only checks for existence anyway.
      - name: Build the installer
        shell: pwsh
        run: pwsh tools/build_installer.ps1 -Stub -OutputDir (Join-Path $env:RUNNER_TEMP 'keyflow-installer')

      # The README shows the real application, so the screenshots are rendered by the same executable
      # that just passed the verification suite instead of being hand-made artwork that drifts out of
      # date. Refresh the committed copies with:
      #   gh run download <run-id> -n keyflow-previews -D docs/previews   # both language sets
      - name: Render README previews
        id: render-previews
        shell: pwsh
        run: |
          $exe = 'bin/Release/net10.0-windows/PianoPath.exe'
          $out = 'docs/previews'
          # Two sets of the same subjects, one per language: README.md reads docs/previews/vi and
          # README.en.md reads docs/previews/en, so each edition shows the interface in its own language.
          # --lang pins it either way, because a runner whose Windows display language happens to be
          # something else must still render the same pictures as every other machine.
          $shots = @(
            # The stage every run shows is the Direct3D 11 engine now; on a runner without a graphics
            # card this is WARP, Windows' software rasterizer: slower, but pixel-for-pixel the same shaders.
            @{ Name = 'stage-live.png';  Args = @('--play-preview') },
            # The same stage under the GPU engine's own name, the picture the README's GPU section embeds.
            @{ Name = 'stage-gpu.png';   Args = @('--play-preview', '--gpu') },
            # Two looks that exercise the effect families the GPU engine draws: trails, ambient layers,
            # arcs between held keys, impact morphs and key labels. A held chord shows the hold effects.
            @{ Name = 'stage-gpu-galaxy.png'; Args = @('--play-preview', '--play-chord', '--gpu', '--preset=GalaxyVoyage') },
            @{ Name = 'stage-gpu-storm.png';  Args = @('--play-preview', '--play-chord', '--gpu', '--preset=ElectricStorm') },
            # The background page draws a picture of your own behind the keys. The README shows that
            # feature with the generated sample from docs/samples, never with a visitor's screenshot: the
            # shot stays deterministic and the repo stays free of artwork somebody else holds the rights to.
            @{ Name = 'background-image.png'; Args = @('--play-preview', "--background-image=$(Join-Path $PWD 'docs/samples/stage-backdrop.png')") },
            @{ Name = 'main-menu.png';   Args = @('--menu') },
            @{ Name = 'design-dock.png'; Args = @('--show-settings', '--settings-tab=style') },
            @{ Name = 'theme-dock.png';  Args = @('--show-settings', '--settings-tab=theme') },
            @{ Name = 'play-dialog.png'; Args = @('--play-dialog') },
            @{ Name = 'shortcuts.png';   Args = @('--shortcuts') },
            # The page that owns the interface language, so each set shows that language in the app itself.
            @{ Name = 'language-dock.png'; Args = @('--show-settings', '--settings-tab=general') }
          )
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Where the app writes one line per picture (App.ReportPreview): a hash of the PNG, how the capture
          # was reached and what drew the stage. Outside docs/previews on purpose. Everything inside that
          # folder is committed, and a line holding a measured duration would change the commit on every run.
          $reports = Join-Path $env:RUNNER_TEMP 'preview-reports'
          Remove-Item -Recurse -Force $reports -ErrorAction SilentlyContinue
          $env:KEYFLOW_PREVIEW_REPORTS = $reports
          $failed = @()
          foreach ($lang in @('en', 'vi')) {
            foreach ($shot in $shots) {
              $name = "$lang/$($shot.Name)"
              $target = Join-Path $out $name
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              # A private settings folder per shot: the README must show a pristine first run, never the
              # leftovers of the verification suite that ran before it in this job.
              $settings = Join-Path $env:TEMP "keyflow-preview-$lang-$([IO.Path]::GetFileNameWithoutExtension($shot.Name))"
              Remove-Item -Recurse -Force $settings -ErrorAction SilentlyContinue
              $args = @('--snapshot', $target, '--compact', "--lang=$lang", "--settings-dir=$settings") + $shot.Args
              $proc = Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait
              # docs/previews is owned by this step, so a picture may be one commit behind the README
              # line that introduces it.
              if (Test-Path $target) { "rendered $name ($([math]::Round((Get-Item $target).Length / 1KB)) KB)" }
              else { $failed += "$name (exit $($proc.ExitCode))" }
            }
          }
          if ($failed.Count) { "::error title=Keyflow previews::$($failed -join ', ') was not written"; exit 1 }
          # One annotation per language with a line per picture. The hash of each PNG is what lets two runs be
          # compared without waiting for the commit step. Per language, not one for all: GitHub cuts an annotation
          # at exactly 4096 characters, and 22 lines of about 300 do not fit (the first run lost eight of them).
          # A finished run's job log cannot be read afterwards; annotations can.
          # (A diagnostic must not fail the step, and pwsh stops on the first error here: hence SilentlyContinue.)
          foreach ($lang in @('en', 'vi')) {
            $lines = Get-ChildItem -Path $reports -Filter "$lang-*.txt" -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }
            "::notice title=Preview capture ($lang)::$($lines -join '%0A')"
          }
          Remove-Item Env:KEYFLOW_PREVIEW_REPORTS

          # The property everything above depends on, checked where it can be seen: render three of the pictures
          # a second time, from the same executable and a fresh settings folder, and compare the bytes. Two
          # renders of the same code that disagree mean the committed pictures will keep changing and the drift
          # check below cannot be trusted. A warning, not a failure: it says the renderer is noisy, which is not
          # something the author of a pull request can act on. One picture of each kind: the GPU stage with a held
          # chord, the settings dock over the stage, and the main menu with its backdrop.
          $unstable = @()
          $recheck = Join-Path $env:RUNNER_TEMP 'preview-recheck'
          Remove-Item -Recurse -Force $recheck -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $recheck | Out-Null
          foreach ($name in @('stage-gpu-galaxy.png', 'theme-dock.png', 'main-menu.png')) {
            $shot = $shots | Where-Object { $_.Name -eq $name }
            $first = Join-Path $out "en/$name"
            $again = Join-Path $recheck "again-$name"
            $settings = Join-Path $env:TEMP "keyflow-preview-again-$([IO.Path]::GetFileNameWithoutExtension($name))"
            Remove-Item -Recurse -Force $settings -ErrorAction SilentlyContinue
            $args = @('--snapshot', $again, '--compact', '--lang=en', "--settings-dir=$settings") + $shot.Args
            Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait | Out-Null
            if (-not (Test-Path $again)) { $unstable += "$name (no second picture)"; continue }
            $hashFirst = (Get-FileHash $first).Hash.Substring(0, 12).ToLower()
            $hashAgain = (Get-FileHash $again).Hash.Substring(0, 12).ToLower()
            if ($hashFirst -ne $hashAgain) {
              $unstable += "$name (sha $hashFirst, then $hashAgain)"
              Copy-Item -Force $first (Join-Path $recheck "first-$name")
            }
          }
          if ($unstable.Count) {
            "::warning title=Previews are not reproducible::A second render of $($unstable -join '; ') differs from the first byte for byte, so the committed pictures will keep changing and the drift check cannot be trusted. Both renders are in the keyflow-preview-recheck artifact."
            "unstable=true" >> $env:GITHUB_OUTPUT
          }
          else { "::notice title=Previews are reproducible::A second render of three pictures matched the first byte for byte." }

      # Every built-in look, drawn by both engines side by side (software | Direct3D 11), in one picture:
      # docs/previews/presets.jpg. It is how a change to the GPU engine is checked against the look each
      # preset was designed with, and the list of names is checked against Stage/VisualPresets.cs by
      # tools/check_sources.py so a new preset cannot be left out.
      - name: Render the preset gallery
        id: render-gallery
        shell: pwsh
        run: |
          $exe = 'bin/Release/net10.0-windows/PianoPath.exe'
          $presets = @('NeonViolet', 'Inferno', 'AuroraRainbow', 'IceCrystal', 'TwoHands', 'ClassicRoll', 'GreenScreen', 'SakuraNocturne', 'ConcertGold', 'MoonlightSonata', 'GalaxyVoyage', 'ElectricStorm', 'OceanDepths', 'RetroArcade')
          $work = Join-Path $env:TEMP 'keyflow-gallery'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          foreach ($preset in $presets) {
            foreach ($engine in @('sw', 'gpu')) {
              $target = Join-Path $work "$preset-$engine.png"
              $settings = Join-Path $work "settings-$preset-$engine"
              $args = @('--snapshot', $target, '--compact', '--lang=en', "--settings-dir=$settings", '--play-preview', '--play-chord', "--preset=$preset")
              # The GPU engine is the stage of every run now; --software is the WPF renderer's one-run
              # escape hatch, so the gallery still checks both engines against each other.
              if ($engine -eq 'gpu') { $args += '--gpu' } else { $args += '--software' }
              Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait | Out-Null
              if (-not (Test-Path $target)) { "::warning title=Preset gallery::$preset ($engine) was not rendered" }
            }
          }
          Add-Type -AssemblyName System.Drawing
          $cellW = 540; $cellH = 350; $label = 26
          $sheet = New-Object System.Drawing.Bitmap ($cellW * 2), (($cellH + $label) * $presets.Count)
          $g = [System.Drawing.Graphics]::FromImage($sheet)
          $g.Clear([System.Drawing.Color]::FromArgb(12, 12, 16))
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $font = New-Object System.Drawing.Font 'Segoe UI', 11
          $brush = [System.Drawing.Brushes]::White
          for ($i = 0; $i -lt $presets.Count; $i++) {
            $y = $i * ($cellH + $label)
            $col = 0
            foreach ($engine in @('sw', 'gpu')) {
              $g.DrawString("$($presets[$i]) - $(if ($engine -eq 'sw') { 'software' } else { 'GPU (WARP)' })", $font, $brush, ($col * $cellW + 8), ($y + 4))
              $file = Join-Path $work "$($presets[$i])-$engine.png"
              if (Test-Path $file) {
                $img = [System.Drawing.Image]::FromFile($file)
                $g.DrawImage($img, (New-Object System.Drawing.Rectangle ($col * $cellW), ($y + $label), $cellW, $cellH))
                $img.Dispose()
              }
              $col++
            }
          }
          $g.Dispose()
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $params = New-Object System.Drawing.Imaging.EncoderParameters 1
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 84L
          New-Item -ItemType Directory -Force -Path 'docs/previews' | Out-Null
          $sheet.Save((Join-Path $PWD 'docs/previews/presets.jpg'), $codec, $params)
          $sheet.Dispose()
          "preset gallery: $([math]::Round((Get-Item 'docs/previews/presets.jpg').Length / 1KB)) KB"

      - name: Upload README previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-previews
          path: |
            docs/previews/**/*.png
            docs/previews/presets.jpg
          if-no-files-found: warn

      # Only when the second render disagreed with the first: both pictures, so the difference can be
      # located pixel by pixel instead of guessed at.
      - name: Upload the pictures that did not reproduce
        if: steps.render-previews.outputs.unstable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: keyflow-preview-recheck
          path: ${{ runner.temp }}/preview-recheck/*.png
          if-no-files-found: warn

      # The workflow renders every file it lists in $shots, so `tools/check_sources.py` lets a README
      # reference a preview that this commit has not rendered yet (see scan_readme).
      #
      # Publish the screenshots with the change that produced them. The step is skipped for pull
      # requests (the checkout is a merge commit then) and for runs triggered by its own commit, so a
      # refresh can never loop.
      #
      # A branch that only takes pull requests (a repository rule the workflow's own token cannot bypass)
      # declines the push with GH013. Nothing is wrong with the build then, so that one rejection is
      # reported as a warning instead of turning the job red, and the renders are still in the
      # keyflow-previews artifact. Every other push failure (network, authentication, a branch that moved
      # meanwhile) still fails the step. bash rather than pwsh because the decision needs git's exit code
      # and its message side by side.
      - name: Commit refreshed previews
        id: commit-previews
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name 'keyflow previews'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/previews
          if git diff --cached --quiet; then
            echo "docs/previews is already up to date."
            echo 'landed=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh the README previews from CI [skip ci]"
          log="$RUNNER_TEMP/previews-push.log"
          if git push >"$log" 2>&1; then
            cat "$log"
            # 'landed' means the pictures are on the branch, not merely committed on this runner: the
            # drift check below reads it, and a local commit whose push was declined has to count as
            # not landed or the drift goes quiet while it is still there.
            echo 'landed=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$log"
          if grep -Eqi 'GH013|repository rule violations|protected branch' "$log"; then
            echo "::warning title=Previews not committed::The branch only accepts pull requests, so the refreshed screenshots were not pushed. They are in the keyflow-previews artifact of this run."
            exit 0
          fi
          exit 1

      # Freshness is the one thing the static checker cannot see: `scan_readme` only proves a preview
      # exists and is named in $shots, so a screenshot that still shows last month's interface keeps the
      # build green. That is what happened between de75f93 and the Quick Adjust / GPU atmosphere changes
      # — the branch rules stopped the preview push above, and nothing in the repo said so.
      #
      # Two traps, both found by running this in CI rather than by reasoning about it:
      #
      #   * The renders are not byte-stable between runners, so every file under docs/previews differs
      #     from the checkout even when no interface moved: run 36834861621 named all 23, and 106 of this
      #     repo's 349 commits are preview refreshes. So "did this build re-render anything" is not the
      #     question — nearly always yes — and asking it warns on every run.
      #   * `git status` is not the drift report either, because the step above commits before it pushes.
      #     A declined push (GH013) leaves the tree clean while the branch still carries the old pictures,
      #     and the check went quiet on run 36836190788 with the drift exactly as unresolved as before.
      #
      # So: diff the working tree against $GITHUB_SHA, the commit this run started from, to see what the
      # build re-rendered, and ask the commit step whether that refresh actually *landed* on the branch.
      # Only "re-rendered and not landed" is drift worth reporting; a landed refresh and an untouched
      # folder both get a plain line. A warning rather than an error on purpose: with the branch rules in
      # place the workflow's own token cannot push, so making it red would paint every pull request red
      # for a thing only a human — or a bypass rule — can settle.
      - name: Report preview drift
        if: always() && steps.render-previews.outcome == 'success' && steps.render-gallery.outcome == 'success'
        shell: bash
        run: |
          drifted=$(git diff --name-only "$GITHUB_SHA" -- docs/previews)
          if [ -z "$drifted" ]; then
            echo "This build rendered the same pictures the branch already carries."
            exit 0
          fi
          count=$(printf '%s\n' "$drifted" | wc -l | tr -d ' ')
          names=$(printf '%s\n' "$drifted" | sed 's|^docs/previews/||' | paste -sd, - | sed 's/,/, /g')
          if [ '${{ steps.commit-previews.outputs.landed }}' = 'true' ]; then
            echo "This build re-rendered $count file(s) and the step above committed them to the branch."
            exit 0
          fi
          {
            echo '## docs/previews does not match this build'
            echo
            echo "This build re-rendered $count screenshot(s) and none of them reached the branch, so the README is still showing the older interface:"
            echo
            printf '%s\n' "$drifted" | sed 's|^|- `|; s|$|`|'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::warning title=Previews are stale::$count file(s) under docs/previews were re-rendered by this build and not committed ($names). Refresh them from the keyflow-previews artifact of this run."
