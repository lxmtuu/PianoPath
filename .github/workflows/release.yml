name: release

# Builds the distributable packages: three portable zips, the .exe installer and a SHA-256 list of all of
# them. The packages are NOT Authenticode-signed: SignPath declined the open-source application (see
# docs/CODE-SIGNING.md), so downloaders see the SmartScreen "Windows protected your PC" dialog and the
# release notes say how to continue. Runs when a version tag such as v2.0.0 is pushed (the packages are
# attached to a GitHub Release) or manually from the Actions tab (they are available as workflow artifacts,
# and no release is created). A session-branch push marked [release-preflight] runs those same
# packaging/smoke-test gates without creating a tag, a release or any public-repository changes.
#
# build.yml already publishes the framework-dependent kind on every push. This workflow builds all portable
# packages, an installer compiled from the folder a user downloads, and runs --verify against the published
# executable. Piano samples are fetched by the app after the user requests audio setup.
on:
  push:
    tags: ["v*"]
    branches: ["arena/**"]
  # Publishing a release through gh/the GitHub API creates a tag without requiring a local tag push.
  # This event must be in the default branch before that release is published.
  release:
    types: [published]
  workflow_dispatch:

env:
  # Where the packages and their documentation are published. The source repository is private; this is
  # the public one. A repository variable can point it elsewhere (a fork, or a repository with another
  # name) without editing this file — the fallback is the name the installer's AppPublisherURL and
  # tools/make_public_docs.py already carry, and tools/check_sources.py makes those agree.
  PUBLIC_REPOSITORY: ${{ vars.PUBLIC_RELEASES_REPOSITORY || 'lxmtuu/KeyFlow' }}
  # Treat the ref as data in PowerShell; never splice this value into a run script.
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  # contents:write is the release itself: the GitHub Release and its packages are created with the workflow token.
  contents: write

# A release run is expensive (three publishes). Two runs of the same tag are one accident
# too many, so a newer run of the same ref replaces the older one — except for a tag, where cancelling a
# half-published release would be worse than letting it finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release-preflight]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The optional 748 MB Salamander library is downloaded by the app after installation; no Git LFS objects are needed.
          lfs: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag '$tag' is not a supported version tag."
          }
          $node = Select-Xml -Path PianoPath.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1
          $version = if ($node) { $node.Node.InnerText.Trim() } else { '' }
          if (-not $version -or $tag -cne "v$version") {
            throw "Release tag '$tag' must match the project version v$version."
          }

      - name: Test the tagged source
        run: dotnet test tests/PianoPath.Tests/PianoPath.Tests.csproj --configuration Release

      - name: Publish self-contained single file (win-x64)
        shell: pwsh
        run: .\publish.ps1 -Mode SelfContained -Runtime win-x64

      # Test the real x64 single-file build before spending time on the two other packages.
      - name: Smoke test the published executable
        # A release is gated on the executable that will ship, not just on the source build.
        # Keep the verification log and annotations, but let a failed check stop packaging and publication.
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'keyflow-verification.log'
          $proc = Start-Process -FilePath 'publish/win-x64/PianoPath.exe' -ArgumentList "--verify","--verify-log=$log" -PassThru -Wait
          $lines = if (Test-Path $log) { Get-Content $log } else { @() }
          $lines | ForEach-Object {
            if ($_ -like 'FAIL*') { $level = 'error' }
            elseif ($_ -like 'SKIP*' -or $_ -like 'NOTE*') { $level = 'warning' }
            elseif ($_ -like 'Verification passed*' -or $_ -like 'Verification failed*') { $level = 'notice' }
            else { return }
            $text = $_ -replace '%', '%25'
            "::${level} title=Keyflow verification::$text"
          }
          if (-not $lines) { "::error title=Keyflow verification::PianoPath.exe did not write $log" }
          @('# Keyflow verification suite (published build)', '```', $lines, '```') | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $proc.ExitCode

      - name: Publish framework-dependent single file (win-x64)
        shell: pwsh
        run: .\publish.ps1 -Mode FrameworkDependent -Runtime win-x64

      # Windows on ARM gets a portable package and no installer: Keyflow.iss sets
      # ArchitecturesAllowed=x64compatible, and an ARM wizard would need its own script and an ARM machine
      # to be checked on. ReadyToRun is switched off for this one leg on purpose — the runner is x64, so
      # compiling it would mean cross-generating ARM code no run of this repository has ever measured, and
      # this package is for a machine nobody here has run it on yet. The two x64 legs keep ReadyToRun.
      - name: Publish self-contained single file (win-arm64)
        shell: pwsh
        run: .\publish.ps1 -Mode SelfContained -Runtime win-arm64 -NoReadyToRun

      # The installer is compiled from the same publish\win-x64 the zips will be packed from, with the same
      # script build.yml runs against a stub folder on every push, so the wizard text cannot be broken
      # in a release without the check having gone red first.
      - name: Build the .exe installer
        shell: pwsh
        run: |
          # The version is read the way publish.ps1 reads it — out of the project file — rather than by
          # asking MSBuild to evaluate it: MSBuild prints warnings beside the value it prints, and an
          # installer named after a warning would be found by whoever downloaded it.
          $node = Select-Xml -Path PianoPath.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1
          $version = if ($node) { $node.Node.InnerText.Trim() } else { '' }
          if (-not $version) { throw 'PianoPath.csproj has no <Version> to name the installer with' }
          pwsh tools/build_installer.ps1 -Version $version -OutputDir installer\Output

      # Packed after the publishes and the installer. The names are the ones publish.ps1 -Zip produces and the
      # download table promises: Keyflow-<version>-<runtime>[-fd].zip.
      - name: Pack the ZIP packages
        shell: pwsh
        run: |
          $node = Select-Xml -Path PianoPath.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1
          $version = if ($node) { $node.Node.InnerText.Trim() } else { '' }
          if (-not $version) { throw 'PianoPath.csproj has no <Version> to name the packages with' }
          Compress-Archive -Path publish/win-x64/* -DestinationPath "publish/Keyflow-$version-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -Path publish/win-x64-fd/* -DestinationPath "publish/Keyflow-$version-win-x64-fd.zip" -CompressionLevel Optimal
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "publish/Keyflow-$version-win-arm64.zip" -CompressionLevel Optimal
          Get-ChildItem publish -Filter '*.zip' | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      # The packages are unsigned; the hashes are what a downloader checks a transfer against: they are the
      # proof that the file which arrived is the file this run attached. Written in the format `sha256sum -c`
      # reads (lowercase hash, two spaces, file name), into publish/ because that folder is git-ignored
      # and already holds the packages — the checkout stays clean either way.
      - name: Hash the packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem publish -Filter '*.zip' -ErrorAction SilentlyContinue) +
                      @(Get-ChildItem 'installer/Output' -Filter 'Keyflow-Setup-*.exe' -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 4) { throw "expected three ZIPs and one installer, found $($packages.Count) package(s)" }
          $sums = 'publish/SHA256SUMS.txt'
          $lines = @(foreach ($package in ($packages | Sort-Object Name)) {
            '{0}  {1}' -f (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $package.Name
          })
          Set-Content -Path $sums -Value $lines -Encoding utf8
          $lines | ForEach-Object { "::notice title=Package SHA256::$_" }
          "::notice title=Packages::$($packages.Count) package(s) hashed into $sums"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Keyflow-packages
          path: |
            publish/*.zip
            publish/SHA256SUMS.txt
            installer/Output/Keyflow-Setup-*.exe
          if-no-files-found: error

      # What the release notes link to has to be a copy the reader can open. When a separate public
      # repository is configured, the changelogs travel there on release/public-<tag> and that copy is the
      # one to point at; when there is no separate repository (or PUBLIC_REPOSITORY is this repository), the
      # files on the tag itself are the only copy there is. A note that links to a repository which does
      # not exist is a 404 in the one place a downloader reads first.
      - name: Decide where the release notes' changelog links point
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $public = ($env:PUBLIC_REPOSITORY).Trim()
          $here = $env:GITHUB_REPOSITORY
          $base = if ($public -and $public -ine $here) {
            "https://github.com/$public/blob/release/public-$tag"
          } else {
            "https://github.com/$here/blob/$tag"
          }
          "changelog_en=$base/CHANGELOG.en.md" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "changelog_vi=$base/CHANGELOG.md" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "public_repository=$public" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "linked to $base" | Write-Host

      - name: Attach packages to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/*.zip
            publish/SHA256SUMS.txt
            installer/Output/Keyflow-Setup-*.exe
          # What to download is the one thing a reader of a release page needs and the one thing generated
          # notes cannot know: four packages that differ in what they need on the target PC, and no
          # signature on any of them. GitHub appends its own generated notes to this body.
          body: |
            **Keyflow ${{ github.ref_name }}** for Windows 10/11 (64-bit). Pick one package:

            | File | What it is |
            | --- | --- |
            | `Keyflow-…-win-x64.zip` | Portable and self-contained: unzip and run `PianoPath.exe`. Nothing else to install. |
            | `Keyflow-Setup-….exe` | Installer for Windows x64: Start Menu and Desktop shortcuts, an uninstall entry, and a wizard in English or Tiếng Việt. |
            | `Keyflow-…-win-x64-fd.zip` | Smaller download; that PC needs the [.NET 10 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0). |
            | `Keyflow-…-win-arm64.zip` | Windows on ARM, self-contained. Published by CI; no ARM machine has run it yet. |
            | `SHA256SUMS.txt` | The SHA-256 of every file above: `Get-FileHash .\Keyflow-…-win-x64.zip -Algorithm SHA256`. |

            Keep the `LICENSE.txt` (MIT) with the application. Salamander Grand Piano V3 is downloaded only
            when requested (about 748 MB); its CC BY 3.0 attribution is written beside the sample files.

            The `.exe` files are **not code-signed** yet, so Windows SmartScreen may show "Windows protected your
            PC" on first run: choose **More info → Run anyway**. Check the download with `SHA256SUMS.txt` first.

            What changed: [CHANGELOG.en.md](${{ steps.notes.outputs.changelog_en }}) ·
            [CHANGELOG.md — tiếng Việt](${{ steps.notes.outputs.changelog_vi }})

            When a separate public release repository is configured, the same packages and documents also
            travel there (<https://github.com/${{ steps.notes.outputs.public_repository }}/releases>); the
            links above point at whichever copy a reader without access here can open.
          generate_release_notes: true

      # Public documents must be reviewable, generated and source-free, but preparing them must
      # not destroy the source checkout or the packages that the public publisher still needs.
      # An isolated index computes a tree; only the separate public repository receives a root commit.
      - name: Prepare the public release tree without changing the source checkout
        id: public_branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Native commands report failure through $LASTEXITCODE; check each one explicitly.
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $tag = $env:RELEASE_TAG
          $branch = "release/public-$tag"
          $staging = Join-Path $env:RUNNER_TEMP 'public-release'

          # Nothing here is guessed: docs/release is committed (the checker compares it with its generator),
          # and docs/previews is what the render steps above put into the working tree.
          if (-not (Test-Path 'docs/release/README.md')) { throw 'docs/release is missing; run tools/make_public_docs.py and commit the result' }
          if (-not (Test-Path 'docs/previews')) { throw 'docs/previews is missing; the README pictures would not resolve on the public page' }

          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item 'docs/release/*' $staging -Recurse -Force
          Copy-Item 'docs/previews' (Join-Path $staging 'docs/previews') -Recurse -Force

          # A public branch may never carry source code. tools/check_sources.py asserts the same list against
          # the committed docs/release tree; this one covers the previews and anything a future copy list adds.
          $forbidden = @('.cs', '.xaml', '.csproj', '.sln', '.iss', '.ps1', '.py', '.hlsl', '.sf2', '.yml')
          $bad = @(Get-ChildItem $staging -Recurse -File -Force | Where-Object { $forbidden -contains $_.Extension })
          if ($bad.Count -gt 0) { throw "the public tree would publish source file(s): $($bad.FullName -join ', ')" }

          # Build a document-only tree in an isolated index. Never checkout an orphan branch,
          # delete the source worktree, or remove the publish/ and installer/ packages needed below.
          # No auxiliary branch is created or pushed in the private source repository.
          $savedIndex = $env:GIT_INDEX_FILE
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'public-release.index'
          Remove-Item $env:GIT_INDEX_FILE -Force -ErrorAction SilentlyContinue
          try {
            $gitDirectory = Join-Path $env:GITHUB_WORKSPACE '.git'
            git -C $staging --git-dir=$gitDirectory --work-tree=$staging read-tree --empty
            if ($LASTEXITCODE -ne 0) { throw 'could not initialize the public index' }
            git -C $staging --git-dir=$gitDirectory --work-tree=$staging add --all -- .
            if ($LASTEXITCODE -ne 0) { throw 'could not stage public documents' }
            $tree = "$(git -C $staging --git-dir=$gitDirectory write-tree)".Trim()
            if ($LASTEXITCODE -ne 0 -or -not $tree) { throw 'could not compute the public release tree' }
          } finally {
            $env:GIT_INDEX_FILE = $savedIndex
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "expected_tree=$tree" -Encoding utf8
          @('# Public release tree', '', "Document-only tree: ``$tree``.",
            'The source checkout and packages are intact; no private release-documents branch is pushed.',
            'The public publisher below may publish these generated documents to the separate public repository.') |
            Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # Publishing is the only thing here that touches another repository, so it is the only step that may
      # hold a token for one: PUBLIC_RELEASES_TOKEN is a fine-grained token scoped to the public release
      # repository alone (Contents: read and write). Everything else in this job works with the workflow's
      # own read-only-capable GITHUB_TOKEN, so a defect in the packaging path cannot reach the public
      # repository. tools/check_sources.py asserts that this token is named nowhere else in the repository.
      #
      # Without the secret the step does not fail: it says what to run and waits a few minutes for that
      # publish to land, because a release whose packages and branch are already in place must not be red
      # only because a credential is held in somebody's gh login instead of in a secret.
      - name: Publish to the public release repository
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          # GITHUB_TOKEN is the workflow's own credential: the step reads this repository's newest release
          # with it (a private repository answers nobody anonymously). The line that publishes replaces
          # GH_TOKEN with PUBLIC_RELEASES_TOKEN before git is given anything, so the two never mix.
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Native commands report failure through $LASTEXITCODE; check each one explicitly.
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $tag = $env:RELEASE_TAG
          $repository = $env:PUBLIC_REPOSITORY
          $branch = "release/public-$tag"
          $staging = Join-Path $env:RUNNER_TEMP 'public-release'
          $scratch = Join-Path $env:RUNNER_TEMP 'public-repo'
          # The generated tree is stable across independently-created root commits and is the content we
          # expect both the workflow publisher and a manual publish to send.
          $expectedTree = "${{ steps.public_branch.outputs.expected_tree }}".Trim()

          # Only the newest release moves main, so the repository's front page shows the current page and a
          # re-published older tag (a fix to its notes, say) cannot push it backwards.
          $latest = ''
          try { $latest = (& gh api ('repos/' + $env:GITHUB_REPOSITORY + '/releases/latest') --jq .tag_name | Out-String).Trim() } catch { }
          $updateMain = ($latest -eq $tag)

          # THE ONE RULE THIS STEP MAY NOT BREAK: main of the source repository is never written here. On
          # 2026-10-03 a publish run aimed at this repository replaced main with the release documents and
          # the sources had to be restored from a branch — the tree that main held for half an hour was
          # ``docs/release`` and nothing else. Two refusals follow from that, and tools/check_sources.py
          # fails the static check if either is edited away.
          #
          # (1) A target that *is* this repository: use documents from the release tag itself,
          # do not push the generated document-only tree anywhere in this repository.
          $sourceRepository = $env:GITHUB_REPOSITORY
          $publish = $true
          if ($repository -ieq $sourceRepository) {
            $updateMain = $false
            $publish = $false
            '::notice title=Public release::PUBLIC_REPOSITORY is this repository, so the documents of ' + $tag + ' are available from its source tag; nothing is pushed to a public repository, and main of the source repository is never written.'
          } else {
            # (2) A target that does not exist yet is a setup step somebody has not done, not a defect in
            # the release: the packages and GitHub Release are in place in
            # this repository already, so this is a warning rather than a red run. The token, when there is
            # one, is scoped to the public repository, so it cannot see an unrelated one: the answer is a
            # 404 either way, and both mean the same thing here.
            & gh api "repos/$repository" --silent 2>$null
            if ($LASTEXITCODE -ne 0) {
              $publish = $false
              '::warning title=Public release::' + $repository + ' does not exist (or is not visible to the token that runs this step), so nothing was published there. Create it with `gh repo create ' + $repository + ' --public` and run `pwsh tools/publish_public.ps1 -Tag ' + $tag + '`, or point the PUBLIC_RELEASES_REPOSITORY variable at the repository that should receive the documents.'
            }
          }

          # The token never appears in a command line — that would print it into the log. gh hands it to git
          # through its credential helper, which reads it from the environment of this step alone.
          if (-not $publish) {
            @('# Public release', '',
              'No public repository received these documents. The release and its packages are attached to this',
              "repository's release page, and the documents are on ``$branch`` here.", '',
              'When a separate public repository exists, the next step of a release publishes the same tree there',
              '(`pwsh tools/publish_public.ps1 -Tag ' + $tag + '`).') | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } elseif ([string]::IsNullOrWhiteSpace($env:PUBLIC_RELEASES_TOKEN)) {
            '::warning title=Public release::No PUBLIC_RELEASES_TOKEN secret: run `pwsh tools/publish_public.ps1 -Tag ' + $tag + '` within the next few minutes to publish ' + $repository + ', or add the secret to let this step do it.'
          } else {
            $env:GH_TOKEN = $env:PUBLIC_RELEASES_TOKEN
            gh auth setup-git
            Remove-Item $scratch -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $scratch | Out-Null
            git -C $scratch init --quiet
            git -C $scratch remote add origin "https://github.com/$repository.git"
            Copy-Item (Join-Path $staging '*') $scratch -Recurse -Force
            git -C $scratch add -A
            git -C $scratch -c user.name='github-actions[bot]' -c user.email='actions@users.noreply.github.com' commit --quiet -m "Keyflow $tag - release documents"
            git -C $scratch push --force origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "the push to $repository failed; does the repository exist and does the token hold Contents: write on it?" }
            if ($updateMain) {
              git -C $scratch push --force origin "HEAD:refs/heads/main"
              if ($LASTEXITCODE -ne 0) { throw "the push of main to $repository failed" }
            }
            "::notice title=Public release::published $branch$(if ($updateMain) { ' and main' }) to $repository"
            "https://github.com/$repository/tree/$branch" | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

            # The public repository is where a downloader lands, so it needs the packages themselves and
            # not only the pages that describe them: a download page whose ZIP and installer live in
            # another repository sends a stranger somewhere they may not be able to go. This is the same
            # create-or-upload that tools/publish_public.ps1 -Packages does by hand, over the same file
            # names the artifact step uploads. A failure here warns instead of failing the run: the
            # packages are attached to this repository's own release either way, and the release branch
            # was pushed a line above.
            $versionNode = Select-Xml -Path PianoPath.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1
            $version = if ($versionNode) { $versionNode.Node.InnerText.Trim() } else { "$tag".TrimStart('v') }
            $files = @(
              Get-ChildItem publish -Filter '*.zip' -ErrorAction SilentlyContinue
              Get-ChildItem publish -Filter 'SHA256SUMS.txt' -ErrorAction SilentlyContinue
              Get-ChildItem 'installer/Output' -Filter 'Keyflow-Setup-*.exe' -ErrorAction SilentlyContinue
            )
            if ($files.Count -eq 0) {
              '::warning title=Public release::no package was found to attach to the release on ' + $repository
            } else {
              $paths = @($files | ForEach-Object { $_.FullName })
              # A missing release is the normal case here; its stderr must not end the step (see the push above).
              $savedPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & gh release view $tag --repo $repository 2>&1 | Out-Null
              $ErrorActionPreference = $savedPreference
              if ($LASTEXITCODE -eq 0) {
                & gh release upload $tag @paths --repo $repository --clobber | Out-Host
              } else {
                $notes = @(
                  "**Keyflow $tag** for Windows 10/11 (64-bit). Pick one package: the installer, or a ZIP you unzip and run ``PianoPath.exe`` from.",
                  '',
                  "``Keyflow-$version-win-x64.zip`` is portable and self-contained. ``Keyflow-Setup-$version.exe`` installs for Windows x64: Start Menu and Desktop shortcuts, an uninstall entry, and a wizard in English or Tiếng Việt. ``Keyflow-$version-win-x64-fd.zip`` is a smaller download for a PC that has the .NET 10 Desktop Runtime, and ``Keyflow-$version-win-arm64.zip`` is Windows on ARM.",
                  '',
                  'Keep the `LICENSE.txt` (MIT) with the application. Salamander Grand Piano V3 is downloaded only when requested (about 748 MB); its CC BY 3.0 attribution is written beside the sample files.',
                  '',
                  'The `.exe` files are **not code-signed**, so Windows SmartScreen may show "Windows protected your PC" on first run: choose **More info → Run anyway**. `SHA256SUMS.txt` covers every file above: `Get-FileHash .\Keyflow-' + $version + '-win-x64.zip -Algorithm SHA256`.',
                  '',
                  "What changed: https://github.com/$repository/blob/$branch/CHANGELOG.en.md · https://github.com/$repository/blob/$branch/CHANGELOG.md"
                ) -join "`n"
                & gh release create $tag @paths --repo $repository --title "Keyflow $version" --notes $notes | Out-Host
              }
              if ($LASTEXITCODE -ne 0) {
                '::warning title=Public release::the packages could not be attached to the release on ' + $repository + ' (does the token hold Contents: write on it?); they are attached to the release of this repository.'
              } else {
                "::notice title=Public release::$($files.Count) package(s) attached to the $tag release on $repository"
                "https://github.com/$repository/releases/tag/$tag" | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              }
            }
          }

          if (-not $publish) {
            return
          }

          # Whether the token was there or the push comes from somebody's desktop, the work is done when the
          # public branch carries this tree. Read anonymously through the API (no credential is used, the
          # repository is public) and wait a little, so a manual publish that is already under way is seen.
          $deadline = (Get-Date).AddMinutes($(if ([string]::IsNullOrWhiteSpace($env:PUBLIC_RELEASES_TOKEN)) { 5 } else { 1 }))
          $published = $false
          while (-not $published -and (Get-Date) -lt $deadline) {
            try {
              $reference = Invoke-RestMethod -Uri "https://api.github.com/repos/$repository/git/ref/heads/$branch" -Headers @{ 'User-Agent' = 'keyflow-release' } -ErrorAction Stop
              $sha = "$($reference.object.sha)".Trim()
              $commitObject = Invoke-RestMethod -Uri "https://api.github.com/repos/$repository/git/commits/$sha" -Headers @{ 'User-Agent' = 'keyflow-release' } -ErrorAction Stop
              $treeSha = "$($commitObject.tree.sha)".Trim()
              $published = if ($expectedTree) { $treeSha -eq $expectedTree } else { -not [string]::IsNullOrWhiteSpace($treeSha) }
            } catch {
              $published = $false
            }
            if (-not $published) { Start-Sleep -Seconds 15 }
          }
          if ($published) {
            "::notice title=Public release::$repository/$branch now carries this release's documents"
          } else {
            '::warning title=Public release::Not published yet. Run `pwsh tools/publish_public.ps1 -Tag ' + $tag + '` when convenient; it builds the same tree from this tag and needs no stored credential.'
          }
